<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>My HERO 1km タイムアタック（試作 3）</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0d0d1a;color:#fff;font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#wrap{position:absolute;left:50%;top:0;width:390px;margin-left:-195px;transform-origin:50% 0;display:flex;flex-direction:column;align-items:center}
/* ---- 上の表示（ゲーム本体の #hud と同じ作り）---- */
#hud{width:390px;display:flex;justify-content:space-between;align-items:center;padding:6px 12px 4px;background:#0d0d1a;flex-shrink:0}
.hcol{display:flex;flex-direction:column;align-items:center;min-width:44px}
.hlb{color:#555;font-size:8px;margin-bottom:1px}
.hv{color:#ffe44d;font-size:12px;font-weight:bold}
#livesBox{display:flex;flex-direction:column;align-items:center}
#livesLabel{color:#555;font-size:8px;margin-bottom:2px}
#hpBar{position:relative;width:78px;height:14px;border-radius:7px;background:#222;border:1.5px solid #444;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,0.6)}
#hpFill{position:absolute;left:0;top:0;height:100%;width:100%;border-radius:6px;background:linear-gradient(180deg,#5dffa0,#1dcc66)}
#hpTxt{position:absolute;left:0;right:0;top:0;line-height:14px;text-align:center;font-size:9px;font-weight:bold;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.9)}
#hPause{margin-left:4px;font-size:16px;padding:3px 9px;border:1px solid #556;border-radius:8px;background:#1c1c2e;color:#dde}
#stage{position:relative;width:390px;height:390px;flex-shrink:0}
#cv{display:block;width:390px;height:390px}
#tag{position:absolute;right:6px;top:6px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,0.45);color:#ffe9a8;font-size:9px;font-weight:bold;pointer-events:none}
/* タイマー（ゲーム本体の #taBox と同じ字）＋ のこりの距離を大きく */
#taBox{position:absolute;left:50%;top:6px;transform:translateX(-50%);text-align:center;font-weight:900;white-space:nowrap;pointer-events:none}
#taT{font-size:30px;line-height:1;color:#fff;letter-spacing:1px;font-variant-numeric:tabular-nums;text-shadow:2px 0 0 #0a1a3a,-2px 0 0 #0a1a3a,0 2px 0 #0a1a3a,0 -2px 0 #0a1a3a,0 0 8px rgba(0,0,0,0.7)}
#taC{display:inline-block;margin-top:4px;font-size:13px;color:#fff;background:rgba(10,20,45,0.72);border-radius:12px;padding:3px 12px}
#taC b{color:#ffe44d;font-size:21px;font-variant-numeric:tabular-nums}
/* ---- 画面の上に重ねる案内（スタート・ゴール・負け）---- */
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:rgba(8,16,40,0.62);text-align:center;padding:10px}
.uiTitle{display:inline-flex;align-items:center;justify-content:center;padding:10px 26px;border-radius:24px;font-size:25px;font-weight:900;letter-spacing:1px;color:#ffe9a8;
  background:linear-gradient(180deg,#2a4a8a,#17305e);border:2px solid #6f9ae0;box-shadow:0 3px 0 #0c1c3c}
#ov p{margin:0;font-size:15px;line-height:1.75;color:#fff;font-weight:bold;text-shadow:0 1px 3px rgba(0,0,0,0.8)}
#ov .how{display:grid;grid-template-columns:auto auto;gap:7px 14px;font-size:15px;font-weight:900;text-align:left;text-shadow:0 1px 3px rgba(0,0,0,0.8)}
#ov .how i{display:inline-block;width:15px;height:15px;border-radius:50%;border:2px solid #fff;vertical-align:-3px;margin-right:5px}
#ov .warn{font-size:15px;font-weight:900;color:#ffd0c0;background:rgba(160,30,30,0.55);border-radius:10px;padding:6px 12px}
#ov .big{font:900 54px/1.1 Menlo,"SF Mono",monospace;text-shadow:0 3px 0 #0a1a3a}
.uiBtn{display:inline-flex;align-items:center;justify-content:center;min-height:58px;width:250px;border-radius:16px;font-size:21px;font-weight:900;color:#fff;
  background:linear-gradient(180deg,#8fe89a,#35ac50);box-shadow:0 4px 0 #1d6b30,0 6px 10px rgba(0,0,0,0.35);border:2px solid rgba(255,255,255,0.55)}
.uiBtn.info{background:linear-gradient(180deg,#7fb6f5,#3a78d0);box-shadow:0 4px 0 #1f4a8a,0 6px 10px rgba(0,0,0,0.35);width:180px;min-height:42px;font-size:14px}
/* ---- コントローラー（ゲーム本体の #pad・.abtn と同じ作り。左だけ十字キー → スティック）---- */
#pad{width:390px;height:172px;background:linear-gradient(160deg,#15151f 0%,#0a0a12 60%,#06060c 100%);display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 14px 2px;flex-shrink:0;border-top:1px solid #222;position:relative;box-shadow:inset 0 2px 12px rgba(0,0,0,0.6)}
#stick,#apad{transform:scale(0.86);transform-origin:50% 100%}   /* ★試作4 コントローラーを少し小さく（画面をたてに広げるため） */
#stick{position:relative;width:156px;height:168px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#stickBase{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;
  background:radial-gradient(circle at 50% 42%,#3a3a44 0%,#26262e 60%,#17171d 100%);
  box-shadow:inset 0 6px 12px rgba(0,0,0,0.7),inset 0 -3px 5px rgba(255,255,255,0.10),0 1px 1px rgba(255,255,255,0.12)}
#stickBase i{position:absolute;left:50%;top:50%;width:0;height:0;border:7px solid transparent;opacity:0.35}
#stickBase .a1{margin:-66px 0 0 -7px;border-bottom-color:#fff;border-top-width:0}
#stickBase .a2{margin:52px 0 0 -7px;border-top-color:#fff;border-bottom-width:0}
#stickBase .a3{margin:-7px 0 0 -66px;border-right-color:#fff;border-left-width:0}
#stickBase .a4{margin:-7px 0 0 52px;border-left-color:#fff;border-right-width:0}
#knob{position:absolute;left:50%;top:50%;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;will-change:transform;
  background:radial-gradient(circle at 50% 36%,#8c8c95 0%,#6a6a72 45%,#4a4a52 100%);
  box-shadow:inset 0 3px 5px rgba(255,255,255,0.4),inset 0 -8px 12px rgba(0,0,0,0.45),0 8px 8px rgba(0,0,0,0.55)}
#knob::after{content:'';position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  background:radial-gradient(circle at 42% 36%,#62626a 0%,#3c3c42 56%,#27272c 100%);box-shadow:inset 0 2px 4px rgba(0,0,0,0.55),inset 0 -2px 3px rgba(255,255,255,0.14)}
#skillrow{position:absolute;top:4px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;font-size:9px;font-weight:bold;color:#8a93a8;letter-spacing:1px;white-space:nowrap}
#starBar{width:66px;height:9px;border-radius:5px;background:#222;border:1px solid #444;overflow:hidden}
#starFill{height:100%;width:0;background:linear-gradient(90deg,#ffb020,#ffe44d)}
#apad{position:relative;width:162px;height:162px;flex-shrink:0}
.abtn{position:absolute;width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid rgba(255,255,255,0.92);
  transition:transform 0.13s cubic-bezier(.34,1.8,.5,1),box-shadow 0.1s,filter 0.1s;color:#fff;
  box-shadow:0 6px 0 rgba(0,0,0,0.22),0 8px 14px rgba(0,0,0,0.4),0 -5px 10px rgba(0,0,0,0.18) inset}
.abtn::before{content:'';position:absolute;top:5px;left:50%;transform:translateX(-50%);width:44px;height:26px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,0.95),rgba(255,255,255,0.25) 60%,transparent 75%);pointer-events:none}
.abtn.act{transform:translateY(6px) scale(0.88,0.82);box-shadow:0 1px 0 rgba(0,0,0,0.25),0 2px 4px rgba(0,0,0,0.4),0 -2px 8px rgba(0,0,0,0.28) inset,0 3px 6px rgba(255,255,255,0.3) inset;filter:brightness(1.12)}
.abtn svg{filter:drop-shadow(0 1.5px 1px rgba(0,0,0,0.35));pointer-events:none;display:block}
.abtn small{position:absolute;left:-10px;right:-10px;bottom:-15px;text-align:center;font-size:9px;font-weight:bold;color:#8a93a8;pointer-events:none}
#bj{top:-2px;left:50%;margin-left:-33px;background:radial-gradient(circle at 40% 30%,#8fd0ff 0%,#3d9bf0 45%,#1f6dd8 100%)}
#ba{top:50%;right:-2px;margin-top:-33px;background:radial-gradient(circle at 40% 30%,#ff9a9a 0%,#f04d4d 45%,#d02020 100%)}
#bdash{top:50%;left:-2px;margin-top:-33px;background:radial-gradient(circle at 50% 55%,#c4ec5a 0%,#a8d840 55%,#86b830 100%)}
#bdash.empty{filter:saturate(0.3) brightness(0.75)}
#bslide{bottom:-2px;left:50%;margin-left:-33px;background:radial-gradient(circle at 40% 30%,#fff3a0 0%,#ffc928 45%,#f09a10 100%)}
.abtn small{color:#aab4c8}
</style>
</head><body>

      <div class="abtn" id="bj" data-k="jump"><svg viewBox="0 0 24 24" width="30" height="30" fill="none"><path d="M12 5 Q12.9 5 13.5 5.7 L18.6 11.2 Q19.4 12 18.4 12.6 Q17.6 13 16.8 12.4 L14.3 10 L14.3 18 Q14.3 19.2 13 19.2 L11 19.2 Q9.7 19.2 9.7 18 L9.7 10 L7.2 12.4 Q6.4 13 5.6 12.6 Q4.6 12 5.4 11.2 L10.5 5.7 Q11.1 5 12 5 Z" fill="#fff" stroke="rgba(0,0,0,0.2)" stroke-width="0.9" stroke-linejoin="round"/></svg></div>

      <div class="abtn" id="bdash" data-k="dash"><svg viewBox="0 0 24 24" width="30" height="30" fill="none"><path d="M4 6.5 L10.5 12 L4 17.5 Z M12 6.5 L19.5 12 L12 17.5 Z" fill="#fff" stroke="rgba(0,0,0,0.22)" stroke-width="1" stroke-linejoin="round"/></svg><small>ダッシュ</small></div>

    </div>
  </div>
</div>
<script>
/*MUS*/
</script>
<script>
(function(){
'use strict';
// ===== うしろから見る 1km タイムアタックの「形の試作 2」（ゲーム本体とは別のページ。主人公の絵は仮）=====
//   コースは「道のり s」と「横 x」で持つ。まん中の線（CX・CZ・向き TH）を1mごとに先に計算して、カーブは 画面に写すときだけ曲げる
//   カメラは主人公のうしろ BACK・高さ CAMH。向きはコースの向き＝いつも背中が見える
var SPRD=/*SPRD*/{}, FROM_GAME=/[?&]from=game/.test(location.search);
var W=390, H=390, HOR=112, F0=320, F=F0, CAMH=2.3, BACK=4.6, NEAR=0.35, GOAL=1000, FAR=112, HW=5, KERB=0.55, OFF=40;
var RUN=9, DASHK=1.65, STARK=1.9, STAR_NEED=12, STAR_T=6;
var cv=document.getElementById('cv'), g=cv.getContext('2d');
var QP=parseFloat((location.search.match(/[?&]q=([\d.]+)/)||[])[1])||0, DPR=QP||Math.min(3,window.devicePixelRatio||1), skyCv=null;
function setRes(d){ DPR=d; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); skyCv=null; }
setRes(DPR);
var ART=/*ART*/null, PS={}, FACE=[];
if(ART){ Object.keys(ART.poses).forEach(function(k){ var p=ART.poses[k], im=new Image(); im.src='data:image/webp;base64,'+p.d; PS[k]={im:im,w:p.w,h:p.h,ax:p.ax}; }); ART.face.forEach(function(d){ var im=new Image(); im.src='data:image/webp;base64,'+d; FACE.push(im); }); }
var CROWD=/*CROWD*/null, CE={}, CB=[];   // CE＝まもの（ゲームの絵）／CB＝応援するヒーロー（体つき・AIの絵。crowd_src.png が来たら入る）
if(CROWD){ Object.keys(CROWD.e).forEach(function(k){ var im=new Image(); im.src='data:image/png;base64,'+CROWD.e[k]; CE[k]=im; }); (CROWD.hb||[]).forEach(function(d){ var im=new Image(); im.src='data:image/webp;base64,'+d; CB.push(im); }); }
var SPR={}; Object.keys(SPRD).forEach(function(k){ var im=new Image(); im.src='data:image/png;base64,'+SPRD[k]; SPR[k]=im; });
function rng(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function oval(x,y,rx,ry){ g.save(); g.translate(x,y); g.scale(Math.max(0.01,rx),Math.max(0.01,ry)); g.moveTo(1,0); g.arc(0,0,1,0,Math.PI*2); g.restore(); }
function rrect(x,y,w,h,r){ g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

// ---- コースの形（カーブ：＋が右）----
var NN=GOAL+OFF+200, KP=new Float32Array(NN+1), TH=new Float32Array(NN+1), CX=new Float32Array(NN+1), CZ=new Float32Array(NN+1);
(function(){ var seg=[[90,0],[110,1/110],[70,0],[150,-1/110],[60,0],[80,1/75],[60,-1/75],[100,0],[130,-1/100],[50,0],[60,1/90],[400,0]], raw=new Float32Array(NN+1), i, s=0, k=0, a;
  for(i=0;i<=NN;i++){ var ss=i-OFF; while(k<seg.length-1 && ss>=s+seg[k][0]){ s+=seg[k][0]; k++; } raw[i]=ss<0?0:seg[k][1]; }
  for(i=0;i<=NN;i++){ a=0; for(var j=-7;j<=7;j++) a+=raw[clamp(i+j,0,NN)]; KP[i]=a/15; }          // 入りと出をなめらかに
  for(i=1;i<=NN;i++){ TH[i]=TH[i-1]+KP[i-1]; CX[i]=CX[i-1]+Math.sin(TH[i-1]); CZ[i]=CZ[i-1]+Math.cos(TH[i-1]); } })();
function fi(s){ return clamp(s+OFF,0,NN-1.001); }
function thAt(s){ var f=fi(s), i=f|0; return TH[i]+(TH[i+1]-TH[i])*(f-i); }
function kpAt(s){ return KP[fi(s)|0]; }
var WX=0, WZ=0;
function wp(s,x){ var f=fi(s), i=f|0, t=f-i, th=TH[i]+(TH[i+1]-TH[i])*t; WX=CX[i]+(CX[i+1]-CX[i])*t+x*Math.cos(th); WZ=CZ[i]+(CZ[i+1]-CZ[i])*t-x*Math.sin(th); }
var cam={X:0,Z:0,yaw:0,c:1,s:0};
function pj(x,y,s,cl){ wp(s,x); var dx=WX-cam.X, dz=WZ-cam.Z, rz=dx*cam.s+dz*cam.c, rx=dx*cam.c-dz*cam.s; if(rz<NEAR){ if(!cl) return null; rz=NEAR; } var k=F/rz; return {x:W/2+rx*k, y:HOR+(CAMH-y)*k, s:k, d:rz}; }
function fog(d){ return clamp(1-(d-(FAR-26))/26,0,1); }

// ---- 音（運動会の曲 U・クリアの曲 C は ゲームと同じ MUS。効果音は短い音）----
var AC=null, musOn=null;
function audioOn(){ try{ if(!AC){ var A=window.AudioContext||window.webkitAudioContext; if(A) AC=new A(); } if(AC && AC.state==='suspended') AC.resume(); }catch(e){} }
function mus(id){ try{ if(!AC||typeof MUS==='undefined') return; if(id){ if(musOn===id) return; MUS.play(id,AC); musOn=id; } else { MUS.stop(); musOn=null; } }catch(e){} }
function sfx(tp){ if(!AC) return; try{ var t=AC.currentTime, o=AC.createOscillator(), v=AC.createGain(); o.connect(v); v.connect(AC.destination);
  var P={jump:['square',420,760,0.12,0.05],slash:['sawtooth',900,180,0.1,0.06],coin:['square',1320,1760,0.08,0.04],hit:['sawtooth',170,60,0.25,0.09],hurdle:['square',240,120,0.14,0.06],
         star:['triangle',520,1560,0.5,0.08],count:['square',660,660,0.1,0.06],go:['square',990,990,0.3,0.07],fall:['sine',700,90,0.6,0.08],kill:['square',300,900,0.12,0.06],dash:['sawtooth',200,520,0.18,0.04]}[tp]; if(!P) return;
  o.type=P[0]; o.frequency.setValueAtTime(P[1],t); o.frequency.exponentialRampToValueAtTime(Math.max(30,P[2]),t+P[3]); v.gain.setValueAtTime(P[4],t); v.gain.exponentialRampToValueAtTime(0.0008,t+P[3]); o.start(t); o.stop(t+P[3]+0.02); }catch(e){} }

// ---- 入力：左はスティック（全方向）・右はボタン4つ。タッチは全部 preventDefault（連打してもズームしない）----
var joy={x:0,y:0}, hold={dash:0}, edge={jump:0,atk:0,slide:0}, key={};
var stickEl=document.getElementById('stick'), knob=document.getElementById('knob'), stickId=null, btnOf={}, tapOf={};
function stickSet(cx,cy){ var r=stickEl.getBoundingClientRect(), R=r.width*0.34, x=(cx-(r.left+r.width/2))/R, y=(cy-(r.top+r.height/2))/R, m=Math.sqrt(x*x+y*y); if(m>1){ x/=m; y/=m; m=1; }
  knob.style.transform='translate('+(x*38)+'px,'+(y*38)+'px)'; if(m<0.16){ x=0; y=0; } joy.x=x; joy.y=y; }
function stickOff(){ stickId=null; joy.x=joy.y=0; knob.style.transform=''; }
function press(k,el){ if(k==='dash') hold.dash=1; else edge[k]=1; if(el) el.classList.add('act'); }
function release(k,el){ if(k==='dash') hold.dash=0; if(el) el.classList.remove('act'); }
document.addEventListener('touchstart',function(e){ e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){ var t=e.changedTouches[i], b=t.target.closest&&t.target.closest('[data-k]'), tp=t.target.closest&&t.target.closest('.tap');
    if(!b && !tp && t.target.closest && t.target.closest('#pad') && t.clientX>stickEl.getBoundingClientRect().right+24){   // ★試作5 ボタンの間・近くを押しても いちばん近いボタンが反応（見た目は小さいまま、当たりだけ広く）
      var bs=document.querySelectorAll('.abtn'), bd=1e9; for(var j=0;j<bs.length;j++){ var r=bs[j].getBoundingClientRect(), dd=Math.pow(t.clientX-(r.left+r.width/2),2)+Math.pow(t.clientY-(r.top+r.height/2),2); if(dd<bd){ bd=dd; b=bs[j]; } } }
    if(b){ btnOf[t.identifier]=b; press(b.dataset.k,b); }

  g.save(); g.translate(x,y-hp.bob*m-(pu>=0 && hp.nm!=='b_punch'?Math.sin(pu*Math.PI)*0.12*m:0)); g.rotate(P.tilt*(hp.nm.charAt(0)==='b'&&hp.nm.charAt(1)==='_'?1:0.3)); if(hp.flip) g.scale(-1,1); if(hp.sq) g.scale(1.08,0.78);   // 横向きのときは かたむけを弱く
  g.drawImage(p.im,-p.ax*k,-p.h*k,p.w*k,p.h*k);
  g.restore();
}
function punchFx(){ if(P.sw<=0) return; var pu=1-P.sw/0.26, o=pj(P.x,0.75,P.s+1.1+pu*0.5); if(!o) return; var r=(0.25+pu*0.5)*o.s;   // パンチ：前に 白い衝撃
  g.globalAlpha=1-pu; g.fillStyle='#fff'; g.strokeStyle='#ffd24a'; g.lineWidth=Math.max(1,0.05*o.s); g.beginPath(); for(var j=0;j<16;j++){ var rr=(j%2?r*0.55:r), a=j*Math.PI/8+pu; g[j?'lineTo':'moveTo'](o.x+Math.cos(a)*rr,o.y+Math.sin(a)*rr*0.8); } g.closePath(); g.fill(); g.stroke(); g.globalAlpha=1; }
function heroDraw(o){ var f=pj(P.x,Math.min(0,P.y),P.s); if(!f) return; var k=st==='fall'?Math.max(0,1-fallT/0.8):1;
  if(st!=='fall'){ g.fillStyle='rgba(0,0,0,0.25)'; g.beginPath(); oval(f.x,f.y,0.42*f.s*(1-Math.min(0.5,P.y*0.4)),0.1*f.s); g.fill(); }
  if(starT>0){ g.fillStyle='hsla('+((tAll*400)%360)+',95%,70%,0.32)'; g.beginPath(); g.arc(o.x,o.y-0.65*o.s,1.0*o.s,0,7); g.fill(); }
  g.globalAlpha=(P.inv>0 && Math.floor(P.inv*16)%2?0.45:1)*k; hero(o.x,o.y,o.s,0.4+0.6*k); g.globalAlpha=1; }
// 自撮りワイプ（左上）：ルーベルトの顔6種類（必死・さけぶ・びびり・あせり・いたい・よろこび）を そのときの様子で切りかえる
var FACE_OF={run:0,dash:1,scared:2,panic:3,hit:4,happy:5,star:5,cry:3,calm:6};
function selfie(){
  var x=8, y=8, s=84, cx=x+s/2, bob=Math.sin(P.ph*0.35*Math.PI*2)*Math.min(2.5,Math.abs(P.vs)*0.22), m=face, t=tAll, i;
  if(m==='hit'||m==='panic'||m==='cry') cx+=Math.sin(t*50)*1.8;
  g.save(); g.beginPath(); rrect(x,y,s,s,12); g.clip();
  g.fillStyle=m==='star'?'hsl('+((t*300)%360)+',90%,72%)':(m==='scared'||m==='cry'?'#6f8fc0':(m==='hit'?'#f0a0a0':'#7fc4f2')); g.fillRect(x,y,s,s);
  g.strokeStyle='rgba(255,255,255,0.55)'; g.lineWidth=2; g.beginPath(); var sp=Math.abs(P.vs)*14; for(i=0;i<6;i++){ var ly=y+((i*17+t*sp*4)%s), lx=x+(i*29%s); g.moveTo(lx,ly); g.lineTo(lx,ly+10+sp*0.1); } g.stroke();
  g.fillStyle='#f1ebdf'; g.beginPath(); oval(cx,y+s+8+bob,34,22); g.fill();                                            // 白いシャツの肩
  var im=FACE[FACE_OF[m]||0]; if(im && im.complete && im.naturalWidth) g.drawImage(im,cx-48,y-9+bob,96,96);
  if(m==='cry'){ g.fillStyle='#8fe0ff'; g.fillRect(cx-17,y+44+bob,5,26); g.fillRect(cx+12,y+44+bob,5,26); }
  g.restore();
  g.strokeStyle='#fff'; g.lineWidth=3; g.beginPath(); rrect(x,y,s,s,12); g.stroke(); g.strokeStyle='#0a1a3a'; g.lineWidth=1; g.beginPath(); rrect(x-1.5,y-1.5,s+3,s+3,13); g.stroke();
  g.fillStyle='#e0352f'; g.beginPath(); rrect(x+4,y+s-16,36,12,4); g.fill(); g.fillStyle='#fff'; g.font='900 8px sans-serif'; g.textAlign='left'; g.fillText((Math.floor(t*2)%2?'●':'○')+' LIVE',x+7,y+s-7);
}
function txt(t,x,y,px,fill,rot){ g.save(); g.translate(x,y); if(rot) g.rotate(rot); g.font='900 '+px+'px sans-serif'; g.textAlign='center'; g.lineJoin='round'; g.lineWidth=Math.max(3,px*0.22); g.strokeStyle='#0a1a3a'; g.strokeText(t,0,0); g.fillStyle=fill; g.fillText(t,0,0); g.restore(); }
function draw(){
  camUpd(); g.setTransform(DPR,0,0,DPR,0,0); g.save(); if(shake>0) g.translate((Math.random()-0.5)*7,(Math.random()-0.5)*5);
  sky(); groundDraw();
  var L=[], base=P.s-BACK, far=base+FAR, o, i;
  function add(o,f){ if(o) L.push({d:o.d,f:f,o:o}); }
  o=pj(0,0,GOAL+70); if(o && o.d<420) add(o,function(o){ schoolDraw(o); });
  tents.forEach(function(t){ if(t.s>base && t.s<far) add(pj(t.x,0,t.s),function(o){ tentDraw(t,o); }); });
  signs.forEach(function(sg){ if(sg.s>base && sg.s<far){ var q=pj(0,0,sg.s); if(q) L.push({d:q.d,f:function(){ signDraw(sg); }}); } });
  hurd.forEach(function(h){ if(h.s>base && h.s<far) add(pj(h.x,0,h.s),function(o){ hurdleDraw(h,o); }); });
  coins.forEach(function(c){ if(!c.got && c.s>base && c.s<far) add(pj(c.x,c.y+Math.sin(c.ph*0.6)*0.06,c.s),function(o){ coinDraw(c,o); }); });
  ens.forEach(function(e){ if(!e.dead && e.s>base && e.s<far) add(pj(e.x,0,e.s),function(o){ enemyDraw(e,o); }); });
  specs.forEach(function(q){ if(q.s>base && q.s<base+80) add(pj(q.x,0,q.s),function(o){ specDraw(q,o); }); });
  if(GOAL>base && GOAL<far){ var q2=pj(0,0,GOAL); if(q2) L.push({d:q2.d,f:goalDraw}); }
  o=pj(P.x,P.y,P.s); if(o){ o.d-=0.01; add(o,heroDraw); }
  L.sort(function(a,b){ return b.d-a.d; }); for(i=0;i<L.length;i++) L[i].f(L[i].o);
  punchFx();
  parts.forEach(function(q){ var o=pj(q.x,q.y,q.s); if(!o) return; var r=Math.max(1.5,(q.st?0.13:0.08)*o.s); g.globalAlpha=Math.min(1,q.l*2.5); g.fillStyle=q.c; if(q.st){ g.beginPath(); g.arc(o.x,o.y,r/2,0,7); g.fill(); } else g.fillRect(o.x-r/2,o.y-r/2,r,r); }); g.globalAlpha=1;
  // ダッシュ・スター：まわりから まん中へ走る線
  if((P.dashing||starT>0) && Math.abs(P.vs)>6){ g.strokeStyle=starT>0?'rgba(255,245,160,0.75)':'rgba(255,255,255,0.6)'; g.lineWidth=2; g.beginPath(); for(i=0;i<22;i++){ var a=(i*0.29+Math.floor(tAll*24)*1.7)%6.283, r0=150+((i*53)%60), r1=r0+50+((i*31)%50); g.moveTo(W/2+Math.cos(a)*r0,HOR+70+Math.sin(a)*r0*0.9); g.lineTo(W/2+Math.cos(a)*r1,HOR+70+Math.sin(a)*r1*0.9); } g.stroke(); }
  if(starT>0){ g.strokeStyle='hsla('+((tAll*400)%360)+',95%,65%,0.8)'; g.lineWidth=6; g.strokeRect(3,3,W-6,H-6); }
  // 声援のふきだし
  bubs.forEach(function(b){ var o=pj(b.x,2.0,b.s); if(!o) return; var k=Math.min(1,(b.m-b.l)*8)*Math.min(1,b.l*4); g.font='900 12px sans-serif'; var w=g.measureText(b.t).width+16, x=clamp(o.x,w/2+4,W-w/2-4), y=clamp(o.y-10,Math.max(106,HOR-8),H-90);
    g.save(); g.translate(x,y); g.scale(k,k); g.fillStyle='#fff'; g.strokeStyle='#0a1a3a'; g.lineWidth=2; g.beginPath(); rrect(-w/2,-24,w,22,9); g.moveTo(-5,-3); g.lineTo(clamp(o.x-x,-12,12),8); g.lineTo(6,-3); g.fill(); g.stroke(); g.fillStyle='#0a1a3a'; g.textAlign='center'; g.fillText(b.t,0,-8); g.restore(); });
  // マンガの音（ズバッ！ドカッ！）
  pops.forEach(function(q){ var o=pj(q.x,q.y,q.s); if(!o) return; var k=1+Math.max(0,(q.l-(q.m-0.12))*6), px=clamp(o.s*0.5,16,34)*k; g.globalAlpha=Math.min(1,q.l*4);
    g.save(); g.translate(clamp(o.x,50,W-50),clamp(o.y,HOR,H-60)); g.rotate(q.r); g.fillStyle='#fff'; g.strokeStyle='#0a1a3a'; g.lineWidth=2; g.beginPath(); for(var j=0;j<20;j++){ var rr=(j%2?px*1.05:px*1.75), a=j*Math.PI/10; g[j?'lineTo':'moveTo'](Math.cos(a)*rr*1.35,Math.sin(a)*rr*0.8-px*0.3); } g.closePath(); g.fill(); g.stroke(); g.restore();
    txt(q.t,clamp(o.x,50,W-50),clamp(o.y,HOR,H-60),px,'#ff4a3a',q.r); g.globalAlpha=1; });
  conf.forEach(function(q){ g.fillStyle=q.c; g.save(); g.translate(q.x,q.y); g.rotate(q.r); g.fillRect(-4,-2,8,4); g.restore(); });
  if(flash>0){ g.fillStyle='rgba(255,60,60,'+(flash*0.9)+')'; g.fillRect(0,0,W,H); } if(flash<0){ g.fillStyle='rgba(255,255,255,'+(-flash*1.6)+')'; g.fillRect(0,0,W,H); }
  g.restore();
  // 進みぐあいのバー（下）
  var pr=clamp(P.s/GOAL,0,1); g.fillStyle='rgba(10,20,45,0.6)'; g.beginPath(); rrect(12,H-17,W-24,9,4.5); g.fill(); g.fillStyle=starT>0?'#fff27a':'#ffd24a'; g.beginPath(); rrect(12,H-17,Math.max(9,(W-24)*pr),9,4.5); g.fill();
  g.fillStyle='#fff'; g.beginPath(); g.arc(12+(W-24)*pr,H-12.5,6,0,7); g.fill(); g.fillStyle='#e0352f'; g.beginPath(); g.arc(12+(W-24)*pr,H-12.5,3.4,0,7); g.fill(); g.font='900 9px sans-serif'; g.textAlign='right'; g.fillStyle='#fff'; g.fillText('GOAL',W-12,H-21);
  if(combo>=2) txt(combo+' コンボ',W-58,H-34,15,'#ffb0e0');
  selfie();
  if(banner){ var bk=Math.min(1,(banner.m-banner.l)*7), bo=Math.min(1,banner.l*3); g.globalAlpha=bo; g.fillStyle='rgba(10,20,45,0.55)'; g.fillRect(0,HOR+28-22*bk,W,44*bk); txt(banner.t,W/2+(1-bk)*200,HOR+38,30,banner.c,-0.03); g.globalAlpha=1; }
  if(st==='count'){ var n=3-Math.floor(tRun/0.8), tx=n>0?String(n):'GO!', z=1.6-((tRun%0.8)/0.8)*0.6; txt(tx,W/2,H/2+20,72*z,n>0?'#fff':'#ffe44d'); }
  if(st==='lost') txt(lostWhy,W/2,H/2,36,'#ff7a7a',-0.05);
  if(st==='goal') txt('ゴール！！',W/2,HOR+40,46,'#ffe44d',-0.05);
}

// ---- 画面 ----
var tmEl=document.getElementById('taT'), remEl=document.getElementById('taR'), ov=document.getElementById('ov'), els={};
['hRem','hCo','hKi','hpFill','hpTxt','starFill','bdash','hLife'].forEach(function(k){ els[k]=document.getElementById(k); });
function fmt(t){ var m=Math.floor(t/60), r=(t-m*60).toFixed(1); return m+':'+(r.length<4?'0':'')+r; }
var hudC='';
function hud(){ var rem=Math.max(0,Math.ceil(GOAL-P.s)), t=st==='goal'||st==='lost'?(P.fin||tRun):(st==='count'||st==='title'?0:tRun), sig=fmt(t)+rem+got+kills+Math.round(stam*50)+starC+(starT>0)+life;
  if(sig===hudC) return; hudC=sig; tmEl.textContent=fmt(t); remEl.textContent=rem; els.hRem.textContent=rem+'m'; els.hLife.innerHTML='<span style="color:#ff5a6e">'+new Array(Math.max(0,life)+1).join('♥')+'</span><span style="color:#444">'+new Array(LIFE_MAX-Math.max(0,life)+1).join('♥')+'</span>'; els.hCo.textContent=got; els.hKi.textContent=kills;
  els.hpFill.style.width=(stam*100)+'%'; els.hpTxt.textContent=Math.round(stam*100); els.bdash.className='abtn'+(stam<0.05?' empty':'')+(hold.dash?' act':'');
  els.starFill.style.width=(starT>0?starT/STAR_T*100:starC/STAR_NEED*100)+'%'; }
function best(){ try{ return parseFloat(localStorage.getItem('ta3d_proto_best_1k'))||0; }catch(e){ return 0; } }
function show(h){ ov.innerHTML=h; ov.style.display='flex'; }
function start(){ audioOn(); build(); ov.style.display='none'; st='count'; tRun=0; mus('U'); }
function title(){ st='title'; build();
  show('<div class="uiTitle">🏃 1km タイムアタック</div>'
    +'<p>スティックで 走る（前・うしろ・ななめ）</p>'
    +'<div class="how"><span><i style="background:#3d9bf0"></i>ジャンプ</span><span><i style="background:#f04d4d"></i>パンチ</span><span><i style="background:#a8d840"></i>ダッシュ</span><span><i style="background:#ffc928"></i>スライディング</span></div>'
    +'<p style="font-size:13px;font-weight:normal">ハードル・穴は ジャンプ／青いゲートは スライディング<br>コイン'+STAR_NEED+'枚で スター モード！</p>'
    +'<div class="warn">♥ ハートは5つ！ まもの・穴・コースアウトで 1つへる</div>'+(best()?'<p>ベスト '+fmt(best())+'</p>':'')+'<div class="uiBtn" id="go">▶ スタート</div>'+(FROM_GAME?'<div class="uiBtn info" id="bk">◀ My HERO にもどる</div>':''));
  if(FROM_GAME) onTap(document.getElementById('bk'),function(){ mus(null); location.href='../index.html?test=1'; });
  onTap(document.getElementById('go'),start); }
function finish(){ face='happy'; var b=best(), nb=!b||P.fin<b; if(nb){ try{ localStorage.setItem('ta3d_proto_best_1k',String(P.fin)); }catch(e){} } mus('C'); cheer('やったー！！'); sfx('star');
  setTimeout(function(){ show('<div class="uiTitle">🏁 ゴール！</div><div class="big">'+fmt(P.fin)+'</div><p>'+(nb?'<b style="color:#7dff8a">ベスト更新！</b>':'ベスト '+fmt(b))+'<br>たおした まもの '+kills+'　・　コイン '+got+'</p><div class="uiBtn" id="again">⏱ もう一回</div>'); onTap(document.getElementById('again'),start); },2600); }
function showLost(){ show('<div class="uiTitle" style="color:#ffb0a0">'+lostWhy+'</div><p>'+Math.max(0,Math.floor(P.s))+'m まで 走った（のこり '+Math.max(0,Math.ceil(GOAL-P.s))+'m）<br>ハートが 5つ なくなると 失格だよ</p><div class="uiBtn" id="again">⏱ もう一回</div>'); onTap(document.getElementById('again'),start); }
onTap(document.getElementById('hPause'),function(){ if(st==='run'||st==='count'||st==='fall'){ prevSt=st; st='pause'; mus(null); show('<div class="uiTitle">⏸ ポーズ</div><div class="uiBtn" id="res">▶ つづける</div><div class="uiBtn info" id="rst">さいしょから</div>');
  onTap(document.getElementById('res'),function(){ ov.style.display='none'; st=prevSt; audioOn(); mus('U'); }); onTap(document.getElementById('rst'),start); } });
document.addEventListener('visibilitychange',function(){ if(document.hidden && (st==='run'||st==='count'||st==='fall')) document.getElementById('hPause')._tap(); });
var acc=0, last=performance.now();
var fN=0, fT=0;
function loop(now){ var dt=now-last; if(st==='run' && !QP){ fN++; fT+=dt; if(fN>=90){ if(fT/fN>21 && DPR>1.5) setRes(Math.max(1.5,DPR-0.5)); fN=0; fT=0; } }   // 1.5秒の平均が 48fps を下回ったら 細かさを1段下げる
  acc+=Math.min(0.1,(now-last)/1000); last=now; while(acc>=DT){ step(); acc-=DT; } draw(); hud(); requestAnimationFrame(loop); }
window.__P=function(){ return {pose:heroPose().nm,flip:heroPose().flip,fa:+P.fa.toFixed(2),dpr:DPR,st:st,P:P,kills:kills,got:got,starC:starC,starT:starT,stam:stam,face:face,n:[ens.length,coins.length,hurd.length,pits.length],pits:pits,ens:ens,hurd:hurd,mus:musOn,joy:joy,hold:hold,why:lostWhy}; };
title(); step(); requestAnimationFrame(loop);
})();
</script>
