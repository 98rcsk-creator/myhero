<h1>BGM 試聴　ステージ10曲</h1>
<p>ボタンを押すと流れるで（もう一回押すと止まる）。<br>音が出ないときは、マナーモードを切って音量を上げてな。</p>
<div class="hd">ステージ10曲（1周 約1分）</div>
<button class="bt" data-id="W1">1　はじまりの草原<small>明るい行進。フルート→バイオリン→トランペット</small></button>
<button class="bt" data-id="W2">2　夕暮れの森<small>なつかしく。オーボエとクラリネット、ハープ</small></button>
<button class="bt" data-id="W3">3　洞窟<small>ゆっくり、ふしぎ。低いファゴットとチェレスタ</small></button>
<button class="bt" data-id="W4">4　雪山<small>きらきら。チェレスタと鉄琴、フルート</small></button>
<button class="bt" data-id="W5">5　火山<small>速くて激しい。トランペットとホルン、太鼓</small></button>
<button class="bt" data-id="W6">6　夜の城<small>古い城の感じ。チェレスタとピチカート、合唱</small></button>
<button class="bt" data-id="W7">7　空中<small>空を飛ぶ感じ。高いバイオリンとフルート</small></button>
<button class="bt" data-id="W8">8　海底<small>ゆらゆら。オカリナとハープ＋低音を足した</small></button>
<button class="bt" data-id="W9">9　魔界<small>速くて暗い。低い金管と太鼓＋低音を足した</small></button>
<button class="bt" data-id="W10">10　天空神殿<small>書き直し：最終決戦。速い短調、金管・合唱・太鼓</small></button>
<div class="hd">前に決めた5曲（ゲームのテスト版に入っている）</div>
<button class="bt" data-id="J">ホーム</button>
<button class="bt" data-id="K">キャラ選択</button>
<button class="bt" data-id="S">ショップ</button>
<button class="bt" data-id="X">ボス</button>
<button class="bt" data-id="C">クリア</button>
<button class="bt" id="stop">■ 止める</button>

  // ---- 1小節ぶんを予約する（only：'mel'＝メロディだけ／'acc'＝伴奏だけ。音量バランスの計測用）----

  function bar(B,S,b,t0,only){

        for(k=0;k<fa.length;k++) for(i=0;i<FP.length;i++) INS[fa[k][0]](B,hz(near(c.tones[FP[i][2]],69)+fa[k][1]),t+FP[i][0]*st,FP[i][1]*st*0.85,fa[k][2]*dy); }

      for(i=0;i<DP.length;i++){ var dc=chord(cs[Math.min(n-1,Math.floor(DP[i][0]/(16/n)))]), dt=t0+DP[i][0]*st, dv=DP[i][2]*dy*dk;
        INS.bdrum(B,0,dt,0,S.don*dv); if(DP[i][2]===1) INS.timp(B,hz(near(dc.bass,38)),dt,0,S.don*0.9*dv); INS.bass(B,hz(near(dc.bass,S.bassC||43)),dt,DP[i][1]*st,S.bass*lv[2]*DP[i][2]); } }
    if(S.hat && (!S.hatOn || S.hatOn(b))) for(i=0;i<16;i+=2) noise(B,t0+i*st,0.03,S.hat*(i%4===2?1:0.6),'highpass',7000,0.15);   // 8分音符のチッチッ（裏拍を強く）
    if(S.snare) for(i=0;i<16;i++) if((S.snarePat||SNARE).charAt(i)==='x') INS.snare(B,0,t0+i*st,0,S.snare*(i%4===0?1:0.55));
    var hit=S.timpHit?S.timpHit.indexOf(b)>=0:(b%4===0), roll=S.timpRoll?S.timpRoll.indexOf(b)>=0:(b%8===7), sw=S.swellBars?S.swellBars.indexOf(b)>=0:(b%8===7);
    if(S.timp){ var c0=chord(cs[0]); if(hit) INS.timp(B,hz(near(c0.bass,41)),t0,0,S.timp*dy);
      if(roll) for(i=0;i<8;i++) INS.timp(B,hz(near(chord(cs[n-1]).bass,41)),t0+st*8+i*st,0,S.timp*dy*(0.35+0.08*i)); }   // 8小節目の後半でクレッシェンドのロール
    if(S.crash && S.crash.indexOf(b)>=0) INS.crash(B,0,t0,0,S.crashV*dy);
    if(S.bdOn && S.bdOn(b)){ INS.bdrum(B,0,t0,0,S.bdV*dy); INS.bdrum(B,0,t0+st*8,0,S.bdV*dy*0.7); }
    if(S.triOn && S.triOn(b)) for(i=2;i<16;i+=4) INS.tri(B,0,t0+i*st,0,S.triV);

      bird(B,t0+sp*st,ct,st,S.birds); }   // 1小節に多くて1回。鳴かない小節もある

  }
  // ---- 出口：そのまま＋リバーブ → コンプレッサー（音割れ防止）----

  // 計測用：音を出さずに全曲を計算して、最大音量・平均音量・同時に鳴る発音体の数を返す
  function render(id,only,loops){ var S=prep(id), bl=60/S.tempo*4, n=S.chords.length*(loops||1), sec=n*bl+2, OC=window.OfflineAudioContext||window.webkitOfflineAudioContext, oc=new OC(2,Math.ceil(sec*44100),44100);

})();

(function(){
  var bts=document.querySelectorAll('.bt[data-id]'), st=document.getElementById('st'), now=null;
  function mark(){ for(var i=0;i<bts.length;i++) bts[i].className='bt'+(bts[i].getAttribute('data-id')===now?' on':''); st.textContent=now?('♪ '+now+' を再生中'):''; }
  function halt(){ MUS.stop(); now=null; mark(); }
  MUS.onEnd=function(){ now=null; mark(); };
  for(var i=0;i<bts.length;i++) bts[i].addEventListener('click',function(){ var id=this.getAttribute('data-id'); if(now===id){ halt(); return; }
    try{ MUS.play(id); now=id; }catch(e){ st.textContent='エラー: '+e.message; return; } mark(); });
  document.getElementById('stop').addEventListener('click',halt);
  document.addEventListener('visibilitychange',function(){ if(document.hidden) halt(); });
})();
</script>
