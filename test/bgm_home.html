<p>ボタンを押すと流れるで（もう一回押すと止まる）。<br>音が出ないときは、マナーモードを切って音量を上げてな。</p>

<button class="bt" data-id="W2">2　夕暮れの森<small>なつかしく。オーボエとクラリネット、ハープ</small></button>
<button class="bt" data-id="W3">3　洞窟<small>ゆっくり、ふしぎ。低いファゴットとチェレスタ</small></button>

<button class="bt" data-id="W7">7　空中<small>空を飛ぶ感じ。高いバイオリンとフルート</small></button>

(function(){
