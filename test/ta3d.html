<style>

  background:radial-gradient(circle at 42% 36%,#62626a 0%,#3c3c42 56%,#27272c 100%);box-shadow:inset 0 2px 4px rgba(0,0,0,0.55),inset 0 -2px 3px rgba(255,255,255,0.14)}

  background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,0.95),rgba(255,255,255,0.25) 60%,transparent 75%);pointer-events:none}

#bj{top:-2px;left:50%;margin-left:-33px;background:radial-gradient(circle at 40% 30%,#8fd0ff 0%,#3d9bf0 45%,#1f6dd8 100%)}
#ba{top:50%;right:-2px;margin-top:-33px;background:radial-gradient(circle at 40% 30%,#ff9a9a 0%,#f04d4d 45%,#d02020 100%)}

#bstar.ready::before{opacity:1}
@keyframes starRdy{from{transform:scale(1)}to{transform:scale(1.09)}}
#bstar.ready.act{animation:none}

<script>
// ゲームと同じ音楽エンジン（test/bgm_home.html の MUS:BEGIN〜MUS:END を そのまま入れている。直すときは あちらを直して作り直す）
// ==== MUS:BEGIN ★v349 ここから MUS:END までは test/bgm_home.html と game/my_hero.html で同じコード。曲づくりは試聴ページで行い、tools/sync_music.py で本体へ写す（本体側を直接直さない）====
// My HERO の音楽エンジンと曲（2026-11。ユーザー「今の音楽は簡易的すぎる。BGMにこだわりたい」から、試聴ページで聴き比べて決めた）
//  楽器23種類（倍音を持たせた波形＋フィルタ＋音量の山）＋リバーブ。曲は「和音の流れ＋メロディ」だけを書き、伴奏（和音・ハープ・ベース・太鼓）は和音から自動で作る。メロディは全部オリジナル
//  曲：J ホーム／K キャラ選択／S ショップ／X ボス／C クリア（1回だけ）／W1〜W10 ステージ
var MUS=(function(){
  var PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  function pc(n){ return (PC[n.charAt(0)]+(n.charAt(1)==='#'?1:(n.charAt(1)==='b'?-1:0))+12)%12; }
  function midi(n){ var m=/^([A-G][#b]?)(-?\d)$/.exec(n); return pc(m[1])+12*(+m[2]+1); }
  function hz(m){ return 440*Math.pow(2,(m-69)/12); }
  function near(p,c){ var m=c-(((c-p)%12)+12)%12; if(c-m>6) m+=12; return m; }   // 音名 p を、高さ c のいちばん近くへ
  function chord(c){ var m=/^([A-G][#b]?)(m?)(M7|9)?(?:\/([A-G][#b]?))?$/.exec(c), r=pc(m[1]), t=[r,(r+(m[2]?3:4))%12,(r+7)%12];
    if(m[3]) t.push((r+(m[3]==='9'?2:11))%12);   // 9＝add9／M7＝メジャー7（ふわっとした響き）
    return {tones:t, bass:m[4]?pc(m[4]):r}; }
  function line(s){ return s.split(/\s+/).filter(Boolean).map(function(t){ var a=t.split('/'); return {m:a[0]==='-'?null:midi(a[0]), len:+a[1]}; }); }

  // ---- 曲（1小節＝16分音符16個。メロディは「音名/長さ」、- は休み。コードは1小節に1つ、または半分ずつ2つ）----
  //   D と G は試聴の2・3回目に作ったホームの曲の元。和音・メロディ（D）と、速い別メロディ（G.mel2）だけを使う（楽器の指定は試聴ページの履歴に残っている）
  var SONGS={
    D:{
      chords:['G9','D/F#','G9','A', 'D','A/C#','Bm','G','D/F#','G','Em','A', 'Bb','C','D','D','Bb','C','D','A'],
      mel:['-/16','-/16','-/8 A4/4 D5/4','E5/12 -/4',
           'A4/4 D5/4 F#5/8','E5/6 F#5/2 E5/4 C#5/4','D5/4 F#5/4 B5/8','A5/6 G5/2 D5/8',
           'A4/4 D5/4 F#5/8','G5/6 A5/2 B5/4 G5/4','E5/4 G5/4 B5/8','A5/8 E5/4 A5/4',
           'Bb5/8 F5/4 D5/4','C6/8 G5/4 E5/4','D6/12 A5/4','A5/4 F#5/4 D5/4 A4/4',
           'D5/4 F5/4 Bb5/8','E5/4 G5/4 C6/8','D6/8 A5/4 F#5/4','E5/12 -/4'], },
    G:{
      mel2:['','','','', '','','','',
            '-/4 F#5/2 A5/2 D6/2 E6/2 D6/2 A5/2','-/4 G5/2 B5/2 D6/2 B5/2 G5/2 B5/2','-/4 E5/2 G5/2 B5/2 E6/2 B5/2 G5/2','-/4 E5/2 A5/2 C#6/2 E6/4 -/2',
            'D5/2 F5/2 Bb5/2 F5/2 D6/2 Bb5/2 F5/2 Bb5/2','E5/2 G5/2 C6/2 G5/2 E6/2 C6/2 G5/2 C6/2','F#5/2 A5/2 D6/2 A5/2 F#6/2 D6/2 A5/2 D6/2','F#6/2 E6/2 D6/2 A5/2 F#5/2 A5/2 D6/4',
            'D5/2 F5/2 Bb5/2 F5/2 D6/2 Bb5/2 F5/2 Bb5/2','E5/2 G5/2 C6/2 G5/2 E6/2 C6/2 G5/2 C6/2','F#5/2 A5/2 D6/2 F#6/2 E6/2 D6/2 A5/2 F#5/2','E5/2 A5/2 C#6/2 E6/2 C#6/4 -/4'], }
  };
  // ★4回目（ユーザー「2分で一周、その間にサビが3回来てほしい」）。D の曲を組み直した40小節＝約2分6秒
  //   夜明け4 → Aメロ8 → サビ①4 → Bメロ4（新しく書いた）→ サビ②8 → 静かな所4（新しく書いた）→ サビ③8（終わりを新しく書いた）
  //   サビは回を追うごとに大きく：①ストリングスが入る／②ホルンとティンパニ／③さらに1オクターブ上のストリングスと鉄琴、ティンパニを2小節ごと、メロディも最後に上へ
  function LSEC(b){ return b<4?0:(b<12?1:(b<16?2:(b<20?3:(b<28?4:(b<32?5:6))))); }
  (function(){ var D=SONGS.D;
    var L={ tempo:76,
      chords:D.chords.slice(0,16).concat(['G','D/F#','Em','A'], D.chords.slice(12,20), ['G9','D/F#','G9','A'], ['Bb','C','D','D','Bb','C','D','D']),
      mel:D.mel.slice(0,16).concat(['B5/6 A5/2 G5/8','A5/6 G5/2 F#5/8','G5/6 F#5/2 E5/4 G5/4','A5/8 C#5/4 E5/4'], D.mel.slice(12,20),
        ['-/4 D5/4 A5/8','F#5/12 -/4','-/4 D5/4 B5/8','A5/8 E5/4 A5/4'], D.mel.slice(12,16), ['D5/4 F5/4 Bb5/8','E5/4 G5/4 C6/8','D6/8 E6/4 F#6/4','D6/12 -/4']) };
    SONGS.L=L;
    // 強弱（計測して決めた）：付ける前は Aメロ -16.1dB／サビ① -16.3／サビ② -16.1／サビ③ -15.0 で、サビが山に聞こえない差しか無かった
    var DYN=[0.8,0.72,1.1,0.7,1.3,0.65,1.5];
    var common={ dyn:function(b){ return DYN[LSEC(b)]; }, tempo:76, padC:57, arpC:45, bassC:40, same:'L', bassPat:'long', snare:0, pad:0.030, swell:0.05, birds:0.013,
      timpHit:[12,20,24,32,34,36,38], timpRoll:[11,19,31], swellBars:[19,31] };
    function mk(o){ for(var k in common) if(!(k in o)) o[k]=common[k]; return o; }
    // ★5回目 J＝オーケストラ版（ユーザー「Fが近い。もっとオーケストラ感。楽器が20個以上ある感じで色んなメロディ。
    //   ただ軸は低音でゆったり、ここから冒険が始まるよって感じのスタート」）
    //   同時に動く線：①メロディ（チェロが軸。上にオカリナ→バイオリン→トランペット）②速い別メロディ（クラリネット→フルート→ピッコロ・チェレスタ）
    //   ③内声（ビオラ・ファゴット・合唱）④走るピチカート ⑤ハープ ⑥金管のファンファーレ ⑦低音（ベース＋コントラバス＋チューバ）＋打楽器
    var I2=['','','','','','','',''].concat(SONGS.G.mel2.slice(8,12), SONGS.G.mel2.slice(12,16), ['','','',''], SONGS.G.mel2.slice(12,20), ['','','',''], SONGS.G.mel2.slice(12,16),
        [SONGS.G.mel2[12],SONGS.G.mel2[13],SONGS.G.mel2[18],'F#5/2 A5/2 D6/2 F#6/2 D6/8']);
    // 楽器が多いぶん音が大きくなり、最初はサビ②で最大1.01・サビ③で1.31（1.0を超えると音割れ）→ J だけ強弱の幅と全体の音量を下げた

  if(st==='count'){ var n=3-Math.floor(tRun/0.8), tx=n>0?String(n):'GO!', z=1.6-((tRun%0.8)/0.8)*0.6; txt(tx,W/2,H/2+20,72*z,n>0?'#fff':'#ffe44d'); }
  if(st==='lost') txt(lostWhy,W/2,H/2,36,'#ff7a7a',-0.05);
  if(st==='goal') txt('ゴール！！',W/2,150,46,'#ffe44d',-0.05);
}

// ---- 画面 ----
var tmEl=document.getElementById('taT'), remEl=document.getElementById('taR'), ov=document.getElementById('ov'), els={};
['hRem','hCo','hKi','hpFill','hpTxt','starFill','bstar','bdash'].forEach(function(k){ els[k]=document.getElementById(k); });
function fmt(t){ var m=Math.floor(t/60), r=(t-m*60).toFixed(1); return m+':'+(r.length<4?'0':'')+r; }
var hudC='';
function hud(){ var rem=Math.max(0,Math.ceil(GOAL-P.s)), t=st==='goal'||st==='lost'?(P.fin||tRun):(st==='count'||st==='title'?0:tRun), sig=fmt(t)+rem+got+kills+Math.round(stam*50)+starC+(starT>0);
  if(sig===hudC) return; hudC=sig; tmEl.textContent=fmt(t); remEl.textContent=rem; els.hRem.textContent=rem+'m'; els.hCo.textContent=got; els.hKi.textContent=kills;
  els.hpFill.style.width=(stam*100)+'%'; els.hpTxt.textContent=Math.round(stam*100); els.bdash.className='abtn'+(stam<0.05?' empty':'')+(hold.dash?' act':'');
  els.starFill.style.width=(starT>0?starT/STAR_T*100:starC/STAR_NEED*100)+'%'; var rdy=starC>=STAR_NEED&&starT<=0; if(els.bstar.classList.contains('ready')!==rdy) els.bstar.classList.toggle('ready',rdy); }
function best(){ try{ return parseFloat(localStorage.getItem('ta3d_proto_best_1k'))||0; }catch(e){ return 0; } }
function show(h){ ov.innerHTML=h; ov.style.display='flex'; }
function start(){ audioOn(); build(); ov.style.display='none'; st='count'; tRun=0; mus('U'); }
function title(){ st='title'; build();
  show('<div class="uiTitle">🏃 1km タイムアタック</div><p>スティックで 走る（前にたおすと 前へ）<br>ハードル・落とし穴は ジャンプ、まものは けん<br><b style="color:#ffb0a0">ふちの赤白を こえたら コースアウトで 負け！</b><br>みどり＝ダッシュ（おしっぱなし）　★＝コイン'+STAR_NEED+'枚で スター</p>'+(best()?'<p>ベスト '+fmt(best())+'</p>':'')+'<div class="uiBtn" id="go">▶ スタート</div>');
  onTap(document.getElementById('go'),start); }
function finish(){ face='happy'; var b=best(), nb=!b||P.fin<b; if(nb){ try{ localStorage.setItem('ta3d_proto_best_1k',String(P.fin)); }catch(e){} } mus('C'); cheer('やったー！！'); sfx('star');
  setTimeout(function(){ show('<div class="uiTitle">🏁 ゴール！</div><div class="big">'+fmt(P.fin)+'</div><p>'+(nb?'<b style="color:#7dff8a">ベスト更新！</b>':'ベスト '+fmt(b))+'<br>たおした まもの '+kills+'　・　コイン '+got+'</p><div class="uiBtn" id="again">⏱ もう一回</div>'); onTap(document.getElementById('again'),start); },2600); }
function showLost(){ show('<div class="uiTitle" style="color:#ffb0a0">'+lostWhy+'</div><p>'+Math.max(0,Math.floor(P.s))+'m まで 走った（のこり '+Math.max(0,Math.ceil(GOAL-P.s))+'m）<br>ふちの赤白の 外に出ると 負けだよ</p><div class="uiBtn" id="again">⏱ もう一回</div>'); onTap(document.getElementById('again'),start); }
onTap(document.getElementById('hPause'),function(){ if(st==='run'||st==='count'||st==='fall'){ prevSt=st; st='pause'; mus(null); show('<div class="uiTitle">⏸ ポーズ</div><div class="uiBtn" id="res">▶ つづける</div><div class="uiBtn info" id="rst">さいしょから</div>');
  onTap(document.getElementById('res'),function(){ ov.style.display='none'; st=prevSt; audioOn(); mus('U'); }); onTap(document.getElementById('rst'),start); } });
document.addEventListener('visibilitychange',function(){ if(document.hidden && (st==='run'||st==='count'||st==='fall')) document.getElementById('hPause')._tap(); });
var acc=0, last=performance.now();
function loop(now){ acc+=Math.min(0.1,(now-last)/1000); last=now; while(acc>=DT){ step(); acc-=DT; } draw(); hud(); requestAnimationFrame(loop); }
window.__P=function(){ return {st:st,P:P,kills:kills,got:got,starC:starC,starT:starT,stam:stam,face:face,n:[ens.length,coins.length,hurd.length,pits.length],pits:pits,ens:ens,hurd:hurd,mus:musOn,joy:joy,hold:hold,why:lostWhy}; };
title(); step(); requestAnimationFrame(loop);
})();
</script>
</body></html>
