<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>My HERO 500m タイムアタック（番外編）</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0d0d1a;color:#fff;font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#wrap{position:absolute;left:50%;top:0;width:390px;margin-left:-195px;transform-origin:50% 0;display:flex;flex-direction:column;align-items:center}
/* ---- 上の表示（ゲーム本体の #hud と同じ作り）---- */
#hud{width:390px;display:flex;justify-content:space-between;align-items:center;padding:6px 12px 4px;background:#0d0d1a;flex-shrink:0}
.hcol{display:flex;flex-direction:column;align-items:center;min-width:44px}
.hlb{color:#555;font-size:8px;margin-bottom:1px}
.hv{color:#ffe44d;font-size:12px;font-weight:bold}
#livesBox{display:flex;flex-direction:column;align-items:center}
#livesLabel{color:#555;font-size:8px;margin-bottom:2px}
#hpBar{position:relative;width:78px;height:14px;border-radius:7px;background:#222;border:1.5px solid #444;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,0.6)}
#hpFill{position:absolute;left:0;top:0;height:100%;width:100%;border-radius:6px;background:linear-gradient(180deg,#5dffa0,#1dcc66)}
#hpTxt{position:absolute;left:0;right:0;top:0;line-height:14px;text-align:center;font-size:9px;font-weight:bold;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.9)}
#hPause{margin-left:4px;font-size:16px;padding:3px 9px;border:1px solid #556;border-radius:8px;background:#1c1c2e;color:#dde}
#stage{position:relative;width:390px;height:390px;flex-shrink:0}
#cv{display:block;width:390px;height:390px}
#tag{position:absolute;right:6px;top:6px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,0.45);color:#ffe9a8;font-size:9px;font-weight:bold;pointer-events:none}
/* タイマー（ゲーム本体の #taBox と同じ字）＋ のこりの距離を大きく */
#taBox{position:absolute;left:50%;top:6px;transform:translateX(-50%);text-align:center;font-weight:900;white-space:nowrap;pointer-events:none}
#taT{font-size:30px;line-height:1;color:#fff;letter-spacing:1px;font-variant-numeric:tabular-nums;text-shadow:2px 0 0 #0a1a3a,-2px 0 0 #0a1a3a,0 2px 0 #0a1a3a,0 -2px 0 #0a1a3a,0 0 8px rgba(0,0,0,0.7)}
#taC{display:inline-block;margin-top:4px;font-size:13px;color:#fff;background:rgba(10,20,45,0.72);border-radius:12px;padding:3px 12px}
#taC b{color:#ffe44d;font-size:21px;font-variant-numeric:tabular-nums}
/* ---- 画面の上に重ねる案内（ホーム・ランキング・あそびかた・ポーズ・ゴール・失格）★試作11 画面全体（上の表示〜コントローラー）をおおう ---- */
#ov{position:absolute;left:0;top:0;width:390px;bottom:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(8,16,40,0.7);text-align:center;padding:14px 16px;box-sizing:border-box}
#ov.home{justify-content:space-between;background:linear-gradient(180deg,rgba(8,20,48,0.05) 0%,rgba(8,20,48,0.2) 42%,rgba(8,20,48,0.9) 64%,#0b1838 100%);padding:22px 18px 18px}
#ov.res{justify-content:flex-end;gap:8px;background:linear-gradient(180deg,rgba(8,20,48,0) 0%,rgba(8,20,48,0) 40%,rgba(8,20,48,0.88) 60%,#0b1838 100%);padding:14px 16px 16px}
#ov p{margin:0;font-size:15px;line-height:1.75;color:#fff;font-weight:bold;text-shadow:0 1px 3px rgba(0,0,0,0.8)}
#ov .how{display:grid;grid-template-columns:auto 1fr;gap:9px 12px;font-size:15px;font-weight:900;text-align:left;align-items:center;width:300px}
#ov .how i{display:inline-block;width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,0.35)}
#ov .how span{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.8)}
#ov .note{font-size:13px;font-weight:bold;color:#cfe3ff;line-height:1.7}
#ov .big{font:900 56px/1.05 Menlo,"SF Mono",monospace;color:#fff;text-shadow:3px 0 0 #0a1a3a,-3px 0 0 #0a1a3a,0 3px 0 #0a1a3a,0 -3px 0 #0a1a3a,0 6px 10px rgba(0,0,0,0.5)}
#ov .row{display:flex;gap:10px;justify-content:center}
/* ゲーム本体の UI DESIGN SYSTEM をそのまま移した（.uiBtn・.uiPanel・.uiTitle）。大きさだけ ここで足す */
.uiBtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;
  min-height:44px;box-sizing:border-box;padding:6px 14px;border-radius:13px;
  font-weight:800;font-size:13px;letter-spacing:0.5px;cursor:pointer;text-align:center;
  -webkit-tap-highlight-color:transparent;white-space:nowrap;
  transition:transform .05s ease,box-shadow .05s ease;}
.uiBtn:active{transform:translateY(4px);}
.uiBtn.go{color:#123f1e;
  background:linear-gradient(180deg,rgba(255,255,255,0.62),rgba(255,255,255,0) 46%),
             linear-gradient(180deg,#9dffb4,#4fd177 62%,#37b45f);
  box-shadow:0 5px 0 #2f8f4c,0 7px 12px rgba(0,0,0,0.30),inset 0 1px 0 rgba(255,255,255,0.85);
  text-shadow:0 1px 0 rgba(255,255,255,0.4);}
.uiBtn.go:active{box-shadow:0 1px 0 #2f8f4c,0 2px 5px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.7);}
.uiBtn.info{color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,0.42),rgba(255,255,255,0) 46%),
             linear-gradient(180deg,#6fc0f5,#3a8fd8 62%,#2a72b8);
  box-shadow:0 5px 0 #1f5590,0 7px 12px rgba(0,0,0,0.30),inset 0 1px 0 rgba(255,255,255,0.55);
  text-shadow:0 1px 2px rgba(0,0,0,0.35);}
.uiBtn.info:active{box-shadow:0 1px 0 #1f5590,0 2px 5px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.45);}
.uiBtn.gold{color:#4a3300;
  background:linear-gradient(180deg,rgba(255,255,255,0.62),rgba(255,255,255,0) 46%),
             linear-gradient(180deg,#ffe89a,#ffcf3f 62%,#f0b41c);
  box-shadow:0 5px 0 #cf9a1e,0 7px 12px rgba(0,0,0,0.30),inset 0 1px 0 rgba(255,255,255,0.85);
  text-shadow:0 1px 0 rgba(255,255,255,0.45);}
.uiBtn.gold:active{box-shadow:0 1px 0 #cf9a1e,0 2px 5px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.7);}
.uiBtn.warn{color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,0.42),rgba(255,255,255,0) 46%),
             linear-gradient(180deg,#ff9a86,#ef5b47 62%,#d33f2c);
  box-shadow:0 5px 0 #a32c1d,0 7px 12px rgba(0,0,0,0.30),inset 0 1px 0 rgba(255,255,255,0.5);
  text-shadow:0 1px 2px rgba(0,0,0,0.35);}
.uiBtn.warn:active{box-shadow:0 1px 0 #a32c1d,0 2px 5px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.4);}
.uiBtn.done{color:#eafff0;
  background:linear-gradient(180deg,rgba(255,255,255,0.30),rgba(255,255,255,0) 46%),
             linear-gradient(180deg,#5fbf72,#3c9a55 62%,#2f7f45);
  box-shadow:0 4px 0 #256537,inset 0 1px 0 rgba(255,255,255,0.45);
  text-shadow:0 1px 2px rgba(0,0,0,0.35);}
.uiBtn.off{color:rgba(230,240,255,0.55);cursor:default;
  background:linear-gradient(180deg,rgba(255,255,255,0.10),rgba(255,255,255,0) 46%),
             linear-gradient(180deg,#5a6472,#434c58 62%,#39414c);
  box-shadow:0 4px 0 #2b323b,inset 0 1px 0 rgba(255,255,255,0.18);}
.uiBtn.off:active{transform:none;}
/* リストの1行・情報パネル。角丸と縁と影を全画面で揃えるためのもの */
.uiPanel{box-sizing:border-box;border-radius:14px;
  background:linear-gradient(180deg,rgba(72,118,190,0.30),rgba(18,40,78,0.55));
  border:1px solid rgba(140,200,255,0.30);
  box-shadow:0 3px 8px rgba(0,0,0,0.38),inset 0 1px 0 rgba(255,255,255,0.14);}
.uiPanel.on{background:linear-gradient(180deg,rgba(255,214,90,0.26),rgba(120,80,20,0.34));
  border-color:rgba(255,214,90,0.75);
  box-shadow:0 0 0 2px rgba(255,214,90,0.35),0 3px 10px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.2);}
.uiPanel.dim{opacity:0.62;filter:saturate(0.5);}
.uiTitle{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:7px 20px;border-radius:999px;margin-bottom:8px;
  font-size:19px;font-weight:900;letter-spacing:1px;color:#fff2b8;
  background:linear-gradient(180deg,rgba(96,150,230,0.42),rgba(20,44,92,0.72));
  border:1.5px solid rgba(150,205,255,0.45);
  box-shadow:0 3px 10px rgba(0,0,0,0.42),inset 0 1px 0 rgba(255,255,255,0.22);
  text-shadow:0 2px 6px rgba(255,170,0,0.5);}
.uiBtn.lg{width:262px;   /* ★ #ov .big（大きいタイムの文字）と名前がぶつかっていたので lg（§1-3） */ min-height:58px;font-size:22px;border-radius:16px}
.uiBtn.mid{width:220px;min-height:48px;font-size:16px}
.uiBtn.half{width:126px;font-size:14px}
/* ホームのロゴ（ゲームのロゴは絵なので、文字のふち取りで近づける） */
.logo{display:flex;flex-direction:column;align-items:center;gap:0}
.logo .rib{display:inline-block;padding:3px 16px;border-radius:999px;font-size:13px;font-weight:900;letter-spacing:3px;color:#4a3300;background:linear-gradient(180deg,#ffe89a,#f0b41c);box-shadow:0 3px 0 #cf9a1e,0 5px 8px rgba(0,0,0,0.3);margin-bottom:4px}
.logo .t1,.logo .t2{font-weight:900;line-height:1.05;text-shadow:3px 0 0 #0a2a6a,-3px 0 0 #0a2a6a,0 3px 0 #0a2a6a,0 -3px 0 #0a2a6a,2px 2px 0 #0a2a6a,-2px 2px 0 #0a2a6a,2px -2px 0 #0a2a6a,-2px -2px 0 #0a2a6a,0 7px 0 #0a2a6a,0 10px 14px rgba(0,0,0,0.45)}
.logo .t1{font-size:66px;color:#ffe44d;letter-spacing:-1px}
.logo .t1 small{font-size:40px}
.logo .t2{font-size:31px;color:#fff;margin-top:2px}
#ov .best{width:290px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
#ov .best .l{font-size:12px;font-weight:bold;color:#b4c6dc;text-align:left}
#ov .best .v{font:900 26px Menlo,"SF Mono",monospace;color:#ffe44d}
/* ランキング：押せないので 箱にしない（文字と細い線だけ） */
#ov .rk{width:310px;text-align:left}
#ov .rk div{display:flex;align-items:baseline;gap:10px;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,0.13);font-weight:bold;color:#fff;font-size:15px}
#ov .rk b{width:34px;text-align:right;color:#ffe44d;font-size:15px}
#ov .rk .t{font:900 18px Menlo,"SF Mono",monospace;flex:1}
#ov .rk .t.ng{font:bold 14px sans-serif;color:#ffb0a0}
#ov .rk small{font-size:11px;color:#8fa6bd}
#ov .rk .me{color:#ffe44d}
#ov .stamp{display:inline-block;padding:4px 14px;border:3px solid #ff5a6e;border-radius:10px;color:#ff5a6e;font-size:22px;font-weight:900;transform:rotate(-8deg);background:rgba(255,255,255,0.92);box-shadow:0 4px 10px rgba(0,0,0,0.35);animation:stampIn .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampIn{from{transform:rotate(-8deg) scale(2.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
#ov .stats{display:flex;gap:16px;justify-content:center;font-size:14px;font-weight:bold;color:#dfeeff}
/* ---- コントローラー（ゲーム本体の #pad・.abtn と同じ作り。左だけ十字キー → スティック）---- */
#pad{width:390px;height:172px;background:linear-gradient(160deg,#15151f 0%,#0a0a12 60%,#06060c 100%);display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 14px 2px;flex-shrink:0;border-top:1px solid #222;position:relative;box-shadow:inset 0 2px 12px rgba(0,0,0,0.6)}
#stick,#apad{transform:scale(0.86);transform-origin:50% 100%}   /* ★試作4 コントローラーを少し小さく（画面をたてに広げるため） */
#stick{position:relative;width:156px;height:168px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#stickBase{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;
  background:radial-gradient(circle at 50% 42%,#3a3a44 0%,#26262e 60%,#17171d 100%);
  box-shadow:inset 0 6px 12px rgba(0,0,0,0.7),inset 0 -3px 5px rgba(255,255,255,0.10),0 1px 1px rgba(255,255,255,0.12)}
#stickBase i{position:absolute;left:50%;top:50%;width:0;height:0;border:7px solid transparent;opacity:0.35}
#stickBase .a1{margin:-66px 0 0 -7px;border-bottom-color:#fff;border-top-width:0}
#stickBase .a2{margin:52px 0 0 -7px;border-top-color:#fff;border-bottom-width:0}
#stickBase .a3{margin:-7px 0 0 -66px;border-right-color:#fff;border-left-width:0}
#stickBase .a4{margin:-7px 0 0 52px;border-left-color:#fff;border-right-width:0}
#knob{position:absolute;left:50%;top:50%;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;will-change:transform;
  background:radial-gradient(circle at 50% 36%,#8c8c95 0%,#6a6a72 45%,#4a4a52 100%);
  box-shadow:inset 0 3px 5px rgba(255,255,255,0.4),inset 0 -8px 12px rgba(0,0,0,0.45),0 8px 8px rgba(0,0,0,0.55)}
#knob::after{content:'';position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  background:radial-gradient(circle at 42% 36%,#62626a 0%,#3c3c42 56%,#27272c 100%);box-shadow:inset 0 2px 4px rgba(0,0,0,0.55),inset 0 -2px 3px rgba(255,255,255,0.14)}
#skillrow{position:absolute;top:4px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;font-size:9px;font-weight:bold;color:#8a93a8;letter-spacing:1px;white-space:nowrap}
#starBar{width:66px;height:9px;border-radius:5px;background:#222;border:1px solid #444;overflow:hidden}
#starFill{height:100%;width:0;background:linear-gradient(90deg,#ffb020,#ffe44d)}
#apad{position:relative;width:162px;height:162px;flex-shrink:0}
.abtn{position:absolute;width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid rgba(255,255,255,0.92);
  transition:transform 0.13s cubic-bezier(.34,1.8,.5,1),box-shadow 0.1s,filter 0.1s;color:#fff;
  box-shadow:0 6px 0 rgba(0,0,0,0.22),0 8px 14px rgba(0,0,0,0.4),0 -5px 10px rgba(0,0,0,0.18) inset}
.abtn::before{content:'';position:absolute;top:5px;left:50%;transform:translateX(-50%);width:44px;height:26px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,0.95),rgba(255,255,255,0.25) 60%,transparent 75%);pointer-events:none}
.abtn.act{transform:translateY(6px) scale(0.88,0.82);box-shadow:0 1px 0 rgba(0,0,0,0.25),0 2px 4px rgba(0,0,0,0.4),0 -2px 8px rgba(0,0,0,0.28) inset,0 3px 6px rgba(255,255,255,0.3) inset;filter:brightness(1.12)}
.abtn svg{filter:drop-shadow(0 1.5px 1px rgba(0,0,0,0.35));pointer-events:none;display:block}
.abtn small{position:absolute;left:-10px;right:-10px;bottom:-15px;text-align:center;font-size:9px;font-weight:bold;color:#8a93a8;pointer-events:none}
#bj{top:-2px;left:50%;margin-left:-33px;background:radial-gradient(circle at 40% 30%,#8fd0ff 0%,#3d9bf0 45%,#1f6dd8 100%)}
#ba{top:50%;right:-2px;margin-top:-33px;background:radial-gradient(circle at 40% 30%,#ff9a9a 0%,#f04d4d 45%,#d02020 100%)}
#bdash{top:50%;left:-2px;margin-top:-33px;background:radial-gradient(circle at 50% 55%,#c4ec5a 0%,#a8d840 55%,#86b830 100%)}
#bdash.empty{filter:saturate(0.3) brightness(0.75)}
#bslide{bottom:-2px;left:50%;margin-left:-33px;background:radial-gradient(circle at 40% 30%,#fff3a0 0%,#ffc928 45%,#f09a10 100%)}
.abtn small{color:#aab4c8}
</style>
</head><body>

<script>
// ゲームと同じ音楽エンジン（test/bgm_home.html の MUS:BEGIN〜MUS:END を そのまま入れている）

var NN=GOAL+OFF+200, KP=new Float32Array(NN+1), TH=new Float32Array(NN+1), CX=new Float32Array(NN+1), CZ=new Float32Array(NN+1);
(function(){ var seg=[[45,0],[60,1/90],[35,0],[75,-1/90],[30,0],[45,1/70],[40,-1/70],[50,0],[45,1/85],[300,0]]   /* ★試作11 500m用：カーブ5つ（右・左・S字・右）。最後の75mはまっすぐ */, raw=new Float32Array(NN+1), i, s=0, k=0, a;
  for(i=0;i<=NN;i++){ var ss=i-OFF; while(k<seg.length-1 && ss>=s+seg[k][0]){ s+=seg[k][0]; k++; } raw[i]=ss<0?0:seg[k][1]; }
  for(i=0;i<=NN;i++){ a=0; for(var j=-7;j<=7;j++) a+=raw[clamp(i+j,0,NN)]; KP[i]=a/15; }          // 入りと出をなめらかに
  for(i=1;i<=NN;i++){ TH[i]=TH[i-1]+KP[i-1]; CX[i]=CX[i-1]+Math.sin(TH[i-1]); CZ[i]=CZ[i-1]+Math.cos(TH[i-1]); } })();

function wp(s,x){ var f=fi(s), i=f|0, t=f-i, th=TH[i]+(TH[i+1]-TH[i])*t; WX=CX[i]+(CX[i+1]-CX[i])*t+x*Math.cos(th); WZ=CZ[i]+(CZ[i+1]-CZ[i])*t-x*Math.sin(th); }

  onTap(document.getElementById('again'),start); onTap(document.getElementById('r2'),ranking); onTap(document.getElementById('h2'),title);
  var el=document.getElementById('rt'), t0=performance.now(); (function up(){ var k=Math.min(1,(performance.now()-t0)/900); el.textContent=fmt(P.fin*k); if(k<1) requestAnimationFrame(up); })(); }
function showLost(){ lastRes=Date.now(); var rk=rkAdd({t:null,d:Math.max(0,Math.floor(P.s)),k:kills,c:got,at:lastRes}); show('<div class="uiTitle" style="color:#ffb0a0">'+lostWhy+'</div><p>'+Math.max(0,Math.floor(P.s))+'m まで 走った（のこり '+Math.max(0,Math.ceil(GOAL-P.s))+'m）<br>ハートが 5つ なくなると 失格だよ<br><span style="color:#8fa6bd">ランキング '+rk+'位</span></p><div class="uiBtn go lg" id="again">⏱ もう一回</div><div class="uiBtn info mid" id="lh">🏠 ホーム</div>'); ov.className=''; onTap(document.getElementById('again'),start); onTap(document.getElementById('lh'),title); }
onTap(document.getElementById('hPause'),function(){ if(st==='run'||st==='count'||st==='fall'){ prevSt=st; st='pause'; mus(null); show('<div class="uiTitle">⏸ ポーズ</div><div class="uiBtn go lg" id="res">▶ つづける</div><div class="uiBtn info mid" id="rst">さいしょから</div><div class="uiBtn info mid" id="ph">🏠 ホーム</div>'); ov.className=''; onTap(document.getElementById('ph'),title);
  onTap(document.getElementById('res'),function(){ ov.style.display='none'; st=prevSt; audioOn(); mus('U'); }); onTap(document.getElementById('rst'),start); } });
document.addEventListener('visibilitychange',function(){ if(document.hidden && (st==='run'||st==='count'||st==='fall')) document.getElementById('hPause')._tap(); });
var acc=0, last=performance.now();
var fN=0, fT=0;
function loop(now){ var dt=now-last; if(st==='run' && !QP){ fN++; fT+=dt; if(fN>=90){ if(fT/fN>21 && DPR>1.5) setRes(Math.max(1.5,DPR-0.5)); fN=0; fT=0; } }   // 1.5秒の平均が 48fps を下回ったら 細かさを1段下げる
  var rd=Math.min(0.1,(now-last)/1000); last=now; if(st==='goal'){ gT+=rd; if(gT>=0.9 && camO===0) camO=Math.PI; if(gT>=2.7 && !resShown){ resShown=true; showResult(); } }
  TS=(st==='goal' && gT<0.8)?0.3:1; acc+=rd*TS; while(acc>=DT){ step(); acc-=DT; } draw(); hud(); requestAnimationFrame(loop); }   // ★試作11 ゴールの直後 0.8秒は 0.3倍のスロー
window.__P=function(){ return {pose:heroPose().nm,flip:heroPose().flip,fa:+P.fa.toFixed(2),dpr:DPR,st:st,P:P,kills:kills,got:got,starC:starC,starT:starT,stam:stam,face:face,n:[ens.length,coins.length,hurd.length,pits.length],pits:pits,ens:ens,hurd:hurd,mus:musOn,joy:joy,hold:hold,why:lostWhy}; };
title(); step(); requestAnimationFrame(loop);
})();
</script>
