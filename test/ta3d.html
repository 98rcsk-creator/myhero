<title>My HERO 100m（うしろから見る形の試作）</title>
<style>
html,body{margin:0;height:100%;background:#0b1424;color:#fff;font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;

#wrap{width:100vw;max-width:390px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column}
#stage{position:relative;width:100%;aspect-ratio:1/1;flex:0 0 auto}
#cv{display:block;width:100%;height:100%}
#tag{position:absolute;left:6px;top:6px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,0.45);color:#ffe9a8;font-size:10px;font-weight:bold;pointer-events:none}
#top{position:absolute;left:0;right:0;top:6px;text-align:center;pointer-events:none}
#tm{font:900 30px/1.05 Menlo,"SF Mono",monospace;letter-spacing:1px;text-shadow:0 2px 0 #0d1f3a,0 0 6px #0d1f3a}
#sub{display:inline-block;margin-top:3px;padding:2px 10px;border-radius:10px;background:rgba(13,31,58,0.62);font-size:12px;font-weight:bold}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(8,16,34,0.55);text-align:center}
#ov h1{margin:0;font-size:22px;font-weight:900;letter-spacing:1px}
#ov p{margin:0;font-size:13px;line-height:1.7;color:#dfeeff}
#ov .big{font:900 40px Menlo,monospace}
.btn{display:inline-block;min-width:200px;padding:13px 0;border-radius:14px;font-size:18px;font-weight:900;color:#fff;background:linear-gradient(180deg,#7ee08a,#2fa04a);
  box-shadow:0 4px 0 #1d6b30;cursor:pointer}
#pad{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-sizing:border-box;
  background:linear-gradient(180deg,#141d33,#0b1424)}
#dp{position:relative;width:calc(var(--c) * 3);height:calc(var(--c) * 3);border-radius:50%;background:rgba(255,255,255,0.06)}
#dp b{position:absolute;width:var(--c);height:var(--c);display:flex;align-items:center;justify-content:center;font-size:calc(var(--c) * 0.42);
  color:#bcd2ff;background:#3a4560;border-radius:10px;box-shadow:inset 0 -3px 0 rgba(0,0,0,0.35)}
#dp b.on{background:#5d6d96;color:#fff}
#dp .u{left:var(--c);top:0}#dp .dn{left:var(--c);bottom:0}#dp .l{left:0;top:var(--c)}#dp .r{right:0;top:var(--c)}
#dp i{position:absolute;left:var(--c);top:var(--c);width:var(--c);height:var(--c);background:#2c3550;border-radius:6px}
#ab{position:relative;width:calc(var(--c) * 3.1);height:calc(var(--c) * 3)}
#ab b{position:absolute;width:calc(var(--c) * 1.35);height:calc(var(--c) * 1.35);border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--c) * 0.5);font-weight:900;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,0.35),inset 0 2px 0 rgba(255,255,255,0.35)}
#ab .jmp{left:0;top:calc(var(--c) * 0.2);background:radial-gradient(circle at 40% 30%,#8fd0ff,#2b7fe0)}
#ab .atk{right:0;bottom:calc(var(--c) * 0.2);background:radial-gradient(circle at 40% 30%,#ff9b8f,#e0402f)}
#ab b.on{transform:scale(0.92);filter:brightness(1.15)}
#ab small{position:absolute;bottom:-15px;left:0;right:0;font-size:10px;color:#9fb6d6;font-weight:bold}
</style>

var key={up:0,down:0,left:0,right:0}, edge={jump:0,atk:0};
var dp=document.getElementById('dp'), dbs={up:dp.querySelector('.u'),down:dp.querySelector('.dn'),left:dp.querySelector('.l'),right:dp.querySelector('.r')}, dpId=null;
function dpSet(e){ var r=dp.getBoundingClientRect(), x=e.clientX-(r.left+r.width/2), y=e.clientY-(r.top+r.height/2), d=r.width*0.12;
  key.up=y<-d?1:0; key.down=y>d?1:0; key.left=x<-d?1:0; key.right=x>d?1:0; dpShow(); }
function dpShow(){ for(var k in dbs) dbs[k].className=dbs[k].className.replace(' on','')+(key[k]?' on':''); }
dp.addEventListener('pointerdown',function(e){ e.preventDefault(); dpId=e.pointerId; try{ dp.setPointerCapture(dpId); }catch(_){} dpSet(e); });
dp.addEventListener('pointermove',function(e){ if(e.pointerId===dpId) dpSet(e); });

dp.addEventListener('pointerup',dpEnd); dp.addEventListener('pointercancel',dpEnd);
document.querySelectorAll('#ab b').forEach(function(b){ var k=b.dataset.k;

var tmEl=document.getElementById('tm'), subEl=document.getElementById('sub'), ov=document.getElementById('ov');
function fmt(t){ var m=Math.floor(t/60), r=(t-m*60).toFixed(1); return m+':'+(r.length<4?'0':'')+r; }
function hud(){ var t=st==='run'?tRun:(st==='goal'?P.fin:0); tmEl.textContent=fmt(t); subEl.textContent=(st==='goal'?'ゴール！':'のこり '+Math.max(0,Math.ceil(GOAL-P.z))+'m')+'　👾'+kills+'　🪙'+got; }
function best(){ try{ return parseFloat(localStorage.getItem('ta3d_proto_best'))||0; }catch(e){ return 0; } }
function title(){ st='title'; build();
  ov.innerHTML='<h1>🏃 100m タイムアタック</h1><p>うしろから見る形の試作（絵は仮）<br>▲ 前へ走る　▼ さがる　◀ ▶ 横へ<br>ハードルは ジャンプ、まものは けん</p>'
    +(best()?'<p>ベスト '+fmt(best())+'</p>':'')+'<div class="btn" id="go">▶ スタート</div>'; ov.style.display='flex';
  document.getElementById('go').addEventListener('click',function(){ ov.style.display='none'; st='count'; tRun=0; }); }
function finish(){ P.fin=tRun; var b=best(), nb=!b||P.fin<b; if(nb){ try{ localStorage.setItem('ta3d_proto_best',String(P.fin)); }catch(e){} }
  setTimeout(function(){ ov.innerHTML='<h1>ゴール！</h1><div class="big">'+fmt(P.fin)+'</div><p>'+(nb?'<b style="color:#7dff8a">ベスト更新！</b>':'ベスト '+fmt(b))+'<br>たおした まもの '+kills+'　コイン '+got+'</p><div class="btn" id="again">⏱ もう一回</div>';
    ov.style.display='flex'; document.getElementById('again').addEventListener('click',function(){ title(); ov.style.display='none'; st='count'; tRun=0; }); },700); }
var acc=0, last=performance.now();
function loop(now){ acc+=Math.min(0.1,(now-last)/1000); last=now; while(acc>=DT){ step(); acc-=DT; } draw(); hud(); requestAnimationFrame(loop); }
window.__P=function(){ return {st:st,P:P,cam:cam,kills:kills,got:got,ens:ens.length,coins:coins.length,hurd:hurd.length}; };
window.__K=key; window.__E=edge;
title(); requestAnimationFrame(loop);
})();
</script>
