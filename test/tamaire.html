<!doctype html>
<html lang="ja"><head>

<title>MyHEROの大運動会 玉入れ</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0d0d1a;color:#fff;font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;

#wrap{position:absolute;left:50%;top:0;width:390px;margin-left:-195px;transform-origin:50% 0}
#stage{position:relative;width:390px;height:600px}
#cv{display:block;width:390px;height:600px}
#tag{position:absolute;left:6px;bottom:6px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,0.4);color:#ffe9a8;font-size:9px;font-weight:bold;pointer-events:none}

#tmT{font-size:34px;line-height:1;color:#fff;letter-spacing:1px;font-variant-numeric:tabular-nums;text-shadow:2px 0 0 #0a1a3a,-2px 0 0 #0a1a3a,0 2px 0 #0a1a3a,0 -2px 0 #0a1a3a,0 0 8px rgba(0,0,0,0.7)}

#tmMe{display:inline-block;margin-top:4px;font-size:13px;color:#fff;background:rgba(10,20,45,0.72);border-radius:12px;padding:3px 12px}
#tmMe b{color:#ff8a8a;font-size:21px;font-variant-numeric:tabular-nums}
#tmPause{position:absolute;right:8px;top:8px;font-size:17px;padding:4px 10px;border:1px solid #556;border-radius:9px;background:rgba(28,28,46,0.85);color:#dde}

#ov{position:absolute;left:0;top:0;width:390px;bottom:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(8,16,40,0.7);text-align:center;padding:14px 16px}
#ov.home{justify-content:space-between;background:linear-gradient(180deg,rgba(8,20,48,0.05) 0%,rgba(8,20,48,0.15) 40%,rgba(8,20,48,0.88) 62%,#0b1838 100%);padding:26px 18px 22px}
#ov.res{justify-content:flex-end;gap:9px;background:linear-gradient(180deg,rgba(8,20,48,0) 0%,rgba(8,20,48,0) 36%,rgba(8,20,48,0.88) 56%,#0b1838 100%);padding:14px 16px 22px}
#ov p{margin:0;font-size:15px;line-height:1.7;color:#fff;font-weight:bold;text-shadow:0 1px 3px rgba(0,0,0,0.8)}
#ov .row{display:flex;gap:10px;justify-content:center}
/* ゲーム本体の UI DESIGN SYSTEM（.uiBtn・.uiPanel・.uiTitle）を 500m走から そのまま */
.uiBtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:44px;padding:6px 14px;border-radius:13px;
  font-weight:800;font-size:13px;letter-spacing:0.5px;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent;white-space:nowrap;transition:transform .05s ease,box-shadow .05s ease}
.uiBtn:active{transform:translateY(4px)}
.uiBtn.go{color:#123f1e;background:linear-gradient(180deg,rgba(255,255,255,0.62),rgba(255,255,255,0) 46%),linear-gradient(180deg,#9dffb4,#4fd177 62%,#37b45f);
  box-shadow:0 5px 0 #2f8f4c,0 7px 12px rgba(0,0,0,0.30),inset 0 1px 0 rgba(255,255,255,0.85);text-shadow:0 1px 0 rgba(255,255,255,0.4)}

.logo .t1{font-size:62px;color:#ffe44d;letter-spacing:2px}
.logo .t2{font-size:22px;margin-top:6px}
.logo .t2 .r{color:#ff6a6a}

.htChip big{font-size:26px;line-height:1;flex:0 0 32px;text-align:center}
.htChip em{font-style:normal;color:#e0352f}

<script>

    G:{

            '-/4 F#5/2 A5/2 D6/2 E6/2 D6/2 A5/2','-/4 G5/2 B5/2 D6/2 B5/2 G5/2 B5/2','-/4 E5/2 G5/2 B5/2 E6/2 B5/2 G5/2','-/4 E5/2 A5/2 C#6/2 E6/4 -/2',
            'D5/2 F5/2 Bb5/2 F5/2 D6/2 Bb5/2 F5/2 Bb5/2','E5/2 G5/2 C6/2 G5/2 E6/2 C6/2 G5/2 C6/2','F#5/2 A5/2 D6/2 A5/2 F#6/2 D6/2 A5/2 D6/2','F#6/2 E6/2 D6/2 A5/2 F#5/2 A5/2 D6/4',

    //   同時に動く線：①メロディ（チェロが軸。上にオカリナ→バイオリン→トランペット）②速い別メロディ（クラリネット→フルート→ピッコロ・チェレスタ）
    //   ③内声（ビオラ・ファゴット・合唱）④走るピチカート ⑤ハープ ⑥金管のファンファーレ ⑦低音（ベース＋コントラバス＋チューバ）＋打楽器
    var I2=['','','','','','','',''].concat(SONGS.G.mel2.slice(8,12), SONGS.G.mel2.slice(12,16), ['','','',''], SONGS.G.mel2.slice(12,20), ['','','',''], SONGS.G.mel2.slice(12,16),
        [SONGS.G.mel2[12],SONGS.G.mel2[13],SONGS.G.mel2[18],'F#5/2 A5/2 D6/2 F#6/2 D6/8']);

    // ★9回目（ユーザー「オープニング（ホーム）の曲が、低音っていうのもあって小さすぎる」）：iPhone のスピーカーで聞こえる大きさを測ると、
    //   夜明けの4小節は -25.3dB でキャラ選択（-16.5）より約9小さかった。夜明けは低いハープ（arpC 45＝110Hz 付近）と低い和音だけで、スマホでは鳴らない音域だった
    //   → 夜明けと静かな所に、ハープと同じ並びを2オクターブ上のチェレスタで重ね（hiArp）、夜明けの強さ 0.8→1.0
    // ★10回目（ユーザー「オープニングがまだ若干小さい」）：全体 -17.9・最初の12秒 -19.1dB（ステージは -16.0）。いちばん大きい所はもう 0.91 なので、

      lead:function(b){ return [ [['cello',-12,0.15],['oca',0,0.11]],

var AC=null, musOn=null;
function audioOn(){ try{ if(!AC){ var A=window.AudioContext||window.webkitAudioContext; if(A) AC=new A(); } if(AC && AC.state==='suspended') AC.resume(); }catch(e){} }
function mus(id){ try{ if(!AC||typeof MUS==='undefined') return; if(id){ if(musOn===id) return; MUS.play(id,AC); musOn=id; } else { MUS.stop(); musOn=null; } }catch(e){} }
var NZB=null; function noiseBuf(){ if(NZB||!AC) return NZB; var n=AC.sampleRate*0.3|0; NZB=AC.createBuffer(1,n,AC.sampleRate); var d=NZB.getChannelData(0); for(var i=0;i<n;i++) d[i]=Math.random()*2-1; return NZB; }
function sfxN(f0,f1,dur,vol,type){ if(!AC) return; try{ var t=AC.currentTime, src=AC.createBufferSource(), bq=AC.createBiquadFilter(), v=AC.createGain(); src.buffer=noiseBuf(); bq.type=type||'bandpass'; bq.Q.value=1.2;
  bq.frequency.setValueAtTime(f0,t); bq.frequency.exponentialRampToValueAtTime(f1,t+dur); src.connect(bq); bq.connect(v); v.connect(AC.destination); v.gain.setValueAtTime(vol,t); v.gain.exponentialRampToValueAtTime(0.0008,t+dur); src.start(t); src.stop(t+dur+0.02); }catch(e){} }
function tone(type,f0,f1,dur,vol,delay){ if(!AC) return; try{ var t=AC.currentTime+(delay||0), o=AC.createOscillator(), v=AC.createGain(); o.type=type; o.connect(v); v.connect(AC.destination);
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur); v.gain.setValueAtTime(vol,t); v.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.start(t); o.stop(t+dur+0.02); }catch(e){} }
// 笛（ピッ／ピーーッ）：高い音を 速く ふるわせる（ホイッスルの コロコロ）。iPhone のスピーカーで聞こえる高さ（§1-24）
function whistle(len){ if(!AC) return; try{ var t=AC.currentTime, o=AC.createOscillator(), lfo=AC.createOscillator(), lg=AC.createGain(), v=AC.createGain();

  else if(st==='stop'){ var flying=balls.some(function(b){ return b.st==='fly'||b.st==='in'; }); if(stT>3.2 || (stT>1.8 && !flying)){ st='count'; stT=0; ci=0; cT=1.1; say('みんなで かぞえるよ！','#ffe44d',30,1.1); } }
  else if(st==='count'){ cT-=dt; if(cT<=0){ countOne(); cT=Math.max(0.11,0.42*Math.pow(0.93,ci)); } }
  else if(st==='final'){ if(stT>2.4 && ov.style.display==='none') showResult(); }
  ballStep(dt);
  for(var i=pops.length-1;i>=0;i--){ pops[i].life-=dt; pops[i].y-=22*dt; if(pops[i].life<=0) pops.splice(i,1); }
  for(i=parts.length-1;i>=0;i--){ var q=parts[i]; q.life-=dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=260*dt; if(q.life<=0) parts.splice(i,1); }
  if(banner){ banner.life-=dt; if(banner.life<=0) banner=null; }
  hud(); }
// かぞえる：1つずつ、両方のかごから 玉を 上へ なげだす（本物の玉入れと同じ）。先に なくなったほうは そこで止まる
var cnt={r:0,w:0};
function countOne(){ ci++; var any=0;
  ['r','w'].forEach(function(tm){ var T=TEAM[tm]; if(T.n>0){ T.n--; T.dirty=1; cnt[tm]=ci; any=1; balls.push({x:T.x,y:RIM_Y+0.05,z:T.z,vx:(Math.random()-0.5)*0.8,vy:4.2+Math.random()*0.8,vz:(Math.random()-0.5)*0.6,tm:tm,own:false,st:'out',age:0}); } });
  if(any){ tone('square',520+Math.min(ci,60)*9,520+Math.min(ci,60)*9,0.07,0.05); countPop=0.25; }
  if(!any || (TEAM.r.n===0 && TEAM.w.n===0)) countEnd(); }
var countPop=0;
function countEnd(){ st='final'; stT=0; var r=cnt.r, w=cnt.w; winner=r>w?'r':(r<w?'w':'d');
  if(winner==='r'){ say('あかぐみの かち！','#ff6a6a',40,2.4); hero.pose='win'; mus('C'); for(var i=0;i<60;i++){ var a=Math.random()*6.2832, v=80+Math.random()*200; parts.push({x:W/2,y:H*0.35,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,life:1.4,c:['#ff5a5a','#ffd84a','#6aff8a','#5ad4ff','#ffffff'][i%5]}); } }
  else if(winner==='w'){ say('しろぐみの かち…','#ffffff',38,2.4); hero.pose='lose'; tone('triangle',440,330,0.5,0.06); }
  else { say('ひきわけ！','#ffe44d',44,2.4); hero.pose='hold'; }
  recSave(); }
function skipCount(){ if(st!=='count') return; while(st==='count'){ ci++; var any=0; ['r','w'].forEach(function(tm){ var T=TEAM[tm]; if(T.n>0){ T.n--; T.dirty=1; cnt[tm]=ci; any=1; } }); if(!any||(TEAM.r.n===0&&TEAM.w.n===0)) countEnd(); } }

// ---- 記録（じぶんが入れた数のベスト・あそんだ回数・かった回数）。My HERO の「大運動会」の画面も ここを読む ----
var REC_KEY='tama_rec';
function recLoad(){ try{ var o=JSON.parse(localStorage.getItem(REC_KEY)||'null'); return (o && typeof o==='object')?o:{best:0,play:0,win:0}; }catch(e){ return {best:0,play:0,win:0}; } }
var lastNew=false;
function recSave(){ var o=recLoad(); o.play=(o.play||0)+1; if(winner==='r') o.win=(o.win||0)+1; lastNew=me.n>(o.best||0); if(lastNew) o.best=me.n; try{ localStorage.setItem(REC_KEY,JSON.stringify(o)); }catch(e){} }

// ---- 描く ----
function draw(){ g.setTransform(DPR,0,0,DPR,0,0);
  if(!bgCv) bgCv=bakeBg(); g.drawImage(bgCv,0,0,W,H);
  var sh=shadowSprite(), L=[], i, b, o;
  for(i=0;i<balls.length;i++){ b=balls[i]; if(b.st==='fly'||b.st==='ground'){ o=pj(b.x,0,b.z); if(o){ var r=BALL_R*o.s*(b.st==='fly'?clamp(1.6-b.y*0.25,0.6,1.6):1.2); g.drawImage(sh,o.x-r*1.6,o.y-r*0.5,r*3.2,r); } } }   // 玉の かげ（地面）＝どこに落ちるか 分かるように
  TEAM.w.kids.forEach(function(k){ L.push({d:k.z,f:function(){ kidDraw(k,tAll); }}); });
  TEAM.r.kids.forEach(function(k){ L.push({d:k.z,f:function(){ kidDraw(k,tAll); }}); });
  L.push({d:TEAM.w.z,f:function(){ basketDraw(TEAM.w,'w'); }}); L.push({d:TEAM.r.z,f:function(){ basketDraw(TEAM.r,'r'); }});
  balls.forEach(function(b){ L.push({d:b.z-(b.st==='in'||b.st==='out'?0.4:0),f:function(){ var o=pj(b.x,b.y,b.z); if(o) ballAt(b.tm,o.x,o.y,Math.max(1.2,BALL_R*o.s)); }}); });
  L.push({d:HERO.z,f:function(){ heroDraw(tAll); }});
  L.sort(function(a,c){ return c.d-a.d; }); for(i=0;i<L.length;i++) L[i].f();
  // はじいた あと（指の線）
  if(trail.length>1){ g.lineCap='round'; g.lineJoin='round'; for(i=1;i<trail.length;i++){ var a=clamp(1-(tAll-trail[i].t)/0.35,0,1); if(a<=0) continue; g.strokeStyle='rgba(255,255,255,'+(a*0.75)+')'; g.lineWidth=7*a+1; g.beginPath(); g.moveTo(trail[i-1].x,trail[i-1].y); g.lineTo(trail[i].x,trail[i].y); g.stroke(); } }
  if(st==='play' && hint.on) hintDraw();
  for(i=0;i<parts.length;i++){ var q=parts[i]; g.globalAlpha=clamp(q.life*2,0,1); g.fillStyle=q.c; g.fillRect(q.x-2.5,q.y-2.5,5,5); } g.globalAlpha=1;
  for(i=0;i<pops.length;i++){ var pp=pops[i]; g.globalAlpha=clamp(pp.life*2.5,0,1); txt(pp.t,pp.x,pp.y,pp.sz,pp.c); } g.globalAlpha=1;
  if(st==='count'||st==='final') countDraw();
  if(banner){ var k=1-banner.life/banner.max, sc=k<0.12?2.2-k/0.12*1.2:1; g.globalAlpha=clamp(banner.life*3,0,1); g.save(); g.translate(W/2,H*0.42); g.scale(sc,sc); txt(banner.t,0,0,banner.sz,banner.c); g.restore(); g.globalAlpha=1; } }
function txt(t,x,y,px,fill){ g.font='900 '+px+'px -apple-system,"Hiragino Sans",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.lineJoin='round'; g.lineWidth=px*0.22; g.strokeStyle='#0a1a3a'; g.strokeText(t,x,y); g.fillStyle=fill; g.fillText(t,x,y); }
function hintDraw(){ var k=(tAll%1.6)/1.6, L0=L_K*H, x=W*0.66, y0=H*0.86, y=y0-L0*Math.min(1,k*1.4), a=k<0.8?1:clamp((1-k)/0.2,0,1);
  g.globalAlpha=0.55; g.strokeStyle='#ffffff'; g.lineWidth=3; g.setLineDash([6,7]); g.beginPath(); g.moveTo(x,y0); g.lineTo(x,y0-L0); g.stroke(); g.setLineDash([]);
  g.globalAlpha=a; g.font='38px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('👆',x+4,y+14); g.globalAlpha=1; txt('このくらい シュッ！',x-12,y0+26,15,'#ffffff'); }
function countDraw(){ var y=H*0.6, pw=300, ph=86, x0=W/2-pw/2; g.fillStyle='rgba(10,20,45,0.78)'; g.beginPath(); g.moveTo(x0+16,y); g.arcTo(x0+pw,y,x0+pw,y+ph,16); g.arcTo(x0+pw,y+ph,x0,y+ph,16); g.arcTo(x0,y+ph,x0,y,16); g.arcTo(x0,y,x0+pw,y,16); g.fill();
  txt('あかぐみ',W/2-75,y+20,15,'#ff8a8a'); txt('しろぐみ',W/2+75,y+20,15,'#ffffff');
  var pr=st==='count'?1+countPop*1.6:1; ['r','w'].forEach(function(tm,i){ var done=st==='final'||(TEAM[tm].n===0 && ci>cnt[tm]); g.save(); g.translate(W/2+(i?75:-75),y+56); if(!done) g.scale(pr,pr); txt(String(cnt[tm]),0,0,38,tm==='r'?'#ff6a6a':'#ffffff'); g.restore(); });
  if(st==='count') txt('タップで とばす',W/2,y+ph+16,12,'#cfe3ff'); }

// ---- 画面（ホーム・あそびかた・ポーズ・結果）----
var tmBox=document.getElementById('tmBox'), tmT=document.getElementById('tmT'), tmN=document.getElementById('tmN'), tmPause=document.getElementById('tmPause'), hudK='';
function hud(){ var s=Math.ceil(left), k=s+'|'+me.n+'|'+st; if(k===hudK) return; hudK=k; tmT.textContent=s; tmT.className=s<=10&&st==='play'?'hurry':''; tmN.textContent=me.n;
  var show=st==='play'||st==='ready'||st==='stop'; tmBox.style.display=show?'':'none'; tmPause.style.display=st==='play'?'':'none'; }
function show(h,cls){ ov.innerHTML=h; ov.className=cls||''; ov.style.display='flex'; }
function hide(){ ov.style.display='none'; ov.className=''; }
function title(){ st='title'; resetGame(); mus(null); TEAM.r.n=14; TEAM.w.n=11; TEAM.r.dirty=TEAM.w.dirty=1;   // ホームの絵では かごに少し入れておく
  var o=recLoad();
  show('<div class="logo"><div class="rib">MyHEROの大運動会</div><div class="t1">玉入れ</div><div class="t2"><span class="r">あかぐみ</span> たい <span class="w">しろぐみ</span></div></div>'
    +'<div style="display:flex;flex-direction:column;align-items:center;gap:13px">'
      +'<div class="uiPanel best"><div class="l">じこベスト（じぶんが 入れた数）<br><span style="color:#8fa6bd">かった '+(o.win||0)+'回 ／ あそんだ '+(o.play||0)+'回</span></div><div class="v">'+(o.best||0)+'こ</div></div>'
      +'<div class="uiBtn go lg" id="go">▶ スタート</div>'
      +'<div class="uiBtn info mid" id="hh">📖 あそびかた</div>'
      +(FROM_GAME?'<div class="uiBtn info mid" id="bk">◀ My HERO にもどる</div>':'')
    +'</div>','home');
  onTap(document.getElementById('go'),start); onTap(document.getElementById('hh'),howto);
  if(FROM_GAME) onTap(document.getElementById('bk'),function(){ mus(null); location.href='../index.html?test=1&from=ta'; }); }
function howto(){ show('<div class="uiTitle">📖 あそびかた</div>'
    +'<div class="htChips">'
      +'<div class="htChip"><big>👆</big><span>画面を <em>上へ シュッ！</em>と はじくと<br>玉を なげる</span></div>'
      +'<div class="htChip"><big>📏</big><span><em>ながく</em> はじくと とおくへ<br><em>みじかく</em> はじくと ちかくへ</span></div>'
      +'<div class="htChip"><big>↗️</big><span>ななめに はじくと 左右へ</span></div>'
      +'<div class="htChip"><big>🧺</big><span>60びょうで <em>赤組の かご</em>に<br>たくさん 入れよう</span></div>'
      +'<div class="htChip"><big>🔢</big><span>さいごに みんなで かぞえる<br>白組より 多ければ <em>かち！</em></span></div>'
    +'</div>'
    +'<div class="uiBtn go mid" id="hg" style="margin-top:6px">▶ スタート</div><div class="uiBtn info mid" id="hb">◀ もどる</div>','htv');
  onTap(document.getElementById('hg'),start); onTap(document.getElementById('hb'),title); }
function start(){ audioOn(); resetGame(); hide(); st='ready'; stT=0; say('よーい','#ffffff',44,1.3); hint.on=hint.on||!recLoad().play; }
function pause(){ if(st!=='play') return; st='pause'; mus(null);
  show('<div class="uiTitle">⏸ おやすみ</div><div class="uiBtn go mid" id="pc">▶ つづける</div><div class="uiBtn info mid" id="pr">↺ はじめから</div><div class="uiBtn info mid" id="ph">🏠 ホームへ</div>');
  onTap(document.getElementById('pc'),function(){ hide(); st='play'; mus('U'); }); onTap(document.getElementById('pr'),start); onTap(document.getElementById('ph'),title); }
onTap(tmPause,pause);
function showResult(){ st='res'; var o=recLoad(), r=cnt.r, w=cnt.w, acc=me.thr?Math.round(me.n/me.thr*100):0;
  show('<div class="stamp'+(winner==='w'?' lose':'')+'">'+(winner==='r'?'かち！':(winner==='w'?'まけ…':'ひきわけ'))+'</div>'
    +'<div class="score"><div><small>あかぐみ</small><span class="r">'+r+'</span></div><span style="color:#8fa6bd;font-size:26px">−</span><div><small>しろぐみ</small><span class="w">'+w+'</span></div></div>'
    +'<div class="stats">じぶんが 入れた <b>'+me.n+'</b> こ'+(lastNew&&me.n>0?'<span class="new">ベスト！</span>':'')+'<br><span style="font-size:12px;color:#b4c6dc">なげた '+me.thr+'こ ／ 入った 割合 '+acc+'% ／ じこベスト '+(o.best||0)+'こ</span></div>'
    +'<div class="uiBtn go lg" id="ra">▶ もういちど</div><div class="uiBtn info mid" id="rh">🏠 ホームへ</div>','res');
  onTap(document.getElementById('ra'),start); onTap(document.getElementById('rh'),title); }

// ---- ループ（1/60秒ずつ すすめる）----
var acc=0, last=performance.now(), fN=0, fT=0;
function loop(now){ var dt=Math.min(0.1,(now-last)/1000); last=now;
  if(st==='play'||st==='ready'){ fN++; fT+=dt*1000; if(fN>=90){ if(fT/fN>21 && DPR>1.5) setRes(1.5); fN=0; fT=0; } }   // 重い端末は 細かさを下げる（500m走と同じ）
  if(st!=='pause'){ acc+=dt; while(acc>=1/60){ step(1/60); acc-=1/60; } countPop=Math.max(0,countPop-dt); }
  draw(); requestAnimationFrame(loop); }
title(); requestAnimationFrame(loop);
})();
</script>
</body></html>
